/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://sarszeuyxrozsljhgyos.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_K_iSNYX03boGTMYWG07hfQ_TjG0FaaA";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   VARIABLES
================================================== */

let currentGame = null;
let currentPlayer = null;

let realtimeGameChannel = null;
let realtimePlayersChannel = null;

let gamePollTimer = null;


/* ==================================================
   ÉLÉMENTS
================================================== */

const statusElement =
  document.getElementById("status");

const homeElement =
  document.getElementById("home");

const lobbyElement =
  document.getElementById("lobby");

const gameCodeElement =
  document.getElementById("gameCode");

const playerListElement =
  document.getElementById("playerList");

const configButton =
  document.getElementById("configButton");

const startButton =
  document.getElementById("startButton");

const leaveButton =
  document.getElementById("leaveButton");

const createButton =
  document.getElementById("createButton");

const joinButton =
  document.getElementById("joinButton");


/* ==================================================
   STATUS
================================================== */

function setStatus(message, type = "") {

  statusElement.textContent = message;

  statusElement.className = type;

}


/* ==================================================
   CODE DE PARTIE
================================================== */

function generateGameCode() {

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (let i = 0; i < 4; i++) {

    code +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return code;

}


/* ==================================================
   SESSION
================================================== */

function saveSession() {

  if (!currentGame || !currentPlayer) {
    return;
  }

  localStorage.setItem(
    "undercover_session",
    JSON.stringify({
      gameId: currentGame.id,
      playerId: currentPlayer.id
    })
  );

}


function clearSession() {

  localStorage.removeItem(
    "undercover_session"
  );

}


/* ==================================================
   CRÉER UNE PARTIE
================================================== */

createButton.addEventListener(
  "click",
  createGame
);


async function createGame() {

  const name =
    document
      .getElementById("createName")
      .value
      .trim();


  if (!name) {

    setStatus(
      "❌ Entre ton prénom.",
      "error"
    );

    return;

  }


  createButton.disabled = true;

  createButton.textContent =
    "Création...";


  setStatus(
    "Création de la partie..."
  );


  try {

    const code =
      generateGameCode();


    const {
      data: game,
      error: gameError
    } =
      await supabaseClient
        .from("games")
        .insert({

          code: code,

          max_players: 10,

          player_count: 3,

          undercover_count: 1,

          topic: null,

          difficulty: "easy",

          status: "waiting"

        })
        .select()
        .single();


    if (gameError) {
      throw gameError;
    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .insert({

          game_id: game.id,

          name: name,

          is_host: true,

          connected: true,

          alive: true,

          eliminated: false,

          revealed: false,

          vote_for: null

        })
        .select()
        .single();


    if (playerError) {
      throw playerError;
    }


    currentGame = game;

    currentPlayer = player;


    saveSession();

    showLobby();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Erreur : " +
      error.message,
      "error"
    );

  }


  createButton.disabled = false;

  createButton.textContent =
    "Créer une partie";

}


/* ==================================================
   REJOINDRE UNE PARTIE
================================================== */

joinButton.addEventListener(
  "click",
  joinGame
);


async function joinGame() {

  const code =
    document
      .getElementById("joinCode")
      .value
      .trim()
      .toUpperCase();


  const name =
    document
      .getElementById("joinName")
      .value
      .trim();


  if (!code || !name) {

    setStatus(
      "❌ Entre le code et ton prénom.",
      "error"
    );

    return;

  }


  joinButton.disabled = true;

  joinButton.textContent =
    "Recherche...";


  setStatus(
    "Recherche de la partie..."
  );


  try {

    const {
      data: game,
      error
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "code",
          code
        )
        .maybeSingle();


    if (error) {
      throw error;
    }


    if (!game) {

      setStatus(
        "❌ Partie introuvable.",
        "error"
      );

      return;

    }


    if (game.status !== "waiting") {

      setStatus(
        "❌ Cette partie a déjà commencé.",
        "error"
      );

      return;

    }


    const {
      count,
      error: countError
    } =
      await supabaseClient
        .from("players")
        .select(
          "id",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "game_id",
          game.id
        );


    if (countError) {
      throw countError;
    }


    const maxPlayers =
      game.player_count ||
      game.max_players ||
      10;


    if (count >= maxPlayers) {

      setStatus(
        "❌ La partie est complète.",
        "error"
      );

      return;

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .insert({

          game_id: game.id,

          name: name,

          is_host: false,

          connected: true,

          alive: true,

          eliminated: false,

          revealed: false,

          vote_for: null

        })
        .select()
        .single();


    if (playerError) {
      throw playerError;
    }


    currentGame = game;

    currentPlayer = player;


    saveSession();

    showLobby();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Erreur : " +
      error.message,
      "error"
    );

  }


  joinButton.disabled = false;

  joinButton.textContent =
    "Rejoindre";

}


/* ==================================================
   AFFICHER LE LOBBY
================================================== */

function showLobby() {

  homeElement.classList.add("hidden");

  lobbyElement.classList.remove("hidden");


  gameCodeElement.textContent =
    currentGame.code;


  if (
    currentPlayer &&
    currentPlayer.is_host
  ) {

    configButton.classList.remove(
      "hidden"
    );

    startButton.classList.remove(
      "hidden"
    );

  } else {

    configButton.classList.add(
      "hidden"
    );

    startButton.classList.add(
      "hidden"
    );

  }


  setStatus(
    "✅ Lobby chargé",
    "success"
  );


  loadPlayers();

  subscribeToRealtime();

  startGamePolling();

}


/* ==================================================
   CHARGER LES JOUEURS
================================================== */

async function loadPlayers() {

  if (!currentGame) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .select("*")
      .eq(
        "game_id",
        currentGame.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Erreur joueurs :",
      error
    );

    return;

  }


  renderPlayers(
    data || []
  );

}


/* ==================================================
   AFFICHER LES JOUEURS
================================================== */

function renderPlayers(players) {

  if (!players.length) {

    playerListElement.textContent =
      "Aucun joueur.";

    return;

  }


  playerListElement.innerHTML =
    players
      .map(function(player) {

        const isMe =
          currentPlayer &&
          player.id ===
          currentPlayer.id;


        const kickButton =
          currentPlayer &&
          currentPlayer.is_host &&
          !player.is_host &&
          !isMe
            ? `
              <button
                class="red small"
                onclick="kickPlayer('${player.id}')"
              >
                🚫 Exclure
              </button>
            `
            : "";


        return `
          <div class="player">

            <span class="player-name">

              🟢
              ${escapeHTML(player.name)}

              ${
                player.is_host
                  ? " 👑"
                  : ""
              }

              ${
                isMe
                  ? " (toi)"
                  : ""
              }

            </span>

            ${kickButton}

          </div>
        `;

      })
      .join("");

}


/* ==================================================
   PROTECTION HTML
================================================== */

function escapeHTML(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      function(char) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[char];

      }
    );

}


/* ==================================================
   EXCLURE UN JOUEUR
================================================== */

async function kickPlayer(playerId) {

  if (
    !currentGame ||
    !currentPlayer ||
    !currentPlayer.is_host
  ) {
    return;
  }


  if (
    !confirm(
      "Voulez-vous vraiment exclure ce joueur ?"
    )
  ) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("players")
        .delete()
        .eq(
          "id",
          playerId
        )
        .eq(
          "game_id",
          currentGame.id
        );


    if (error) {
      throw error;
    }


    setStatus(
      "🚫 Joueur exclu.",
      "success"
    );


    await loadPlayers();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Impossible d'exclure : " +
      error.message,
      "error"
    );

  }

}


/* ==================================================
   CONFIGURATION
================================================== */

configButton.addEventListener(
  "click",
  function() {

    if (
      !currentGame ||
      !currentPlayer ||
      !currentPlayer.is_host
    ) {
      return;
    }


    window.location.href =
      "config.html?game=" +
      encodeURIComponent(
        currentGame.id
      ) +
      "&player=" +
      encodeURIComponent(
        currentPlayer.id
      );

  }
);


/* ==================================================
   LANCER LA PARTIE
================================================== */

startButton.addEventListener(
  "click",
  startGame
);


async function startGame() {

  if (
    !currentGame ||
    !currentPlayer ||
    !currentPlayer.is_host
  ) {
    return;
  }


  startButton.disabled = true;

  startButton.textContent =
    "🎮 Lancement...";


  try {

    const {
      data: game,
      error: gameError
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "id",
          currentGame.id
        )
        .maybeSingle();


    if (gameError) {
      throw gameError;
    }


    if (!game) {

      throw new Error(
        "Partie introuvable."
      );

    }


    if (
      !game.player_count ||
      !game.undercover_count
    ) {

      throw new Error(
        "Configure d'abord la partie."
      );

    }


    if (
      game.undercover_count >=
      game.player_count
    ) {

      throw new Error(
        "Il faut au moins un joueur classique."
      );

    }


    const {
      data: players,
      error: playersError
    } =
      await supabaseClient
        .from("players")
        .select("id")
        .eq(
          "game_id",
          currentGame.id
        );


    if (playersError) {
      throw playersError;
    }


    if (
      !players ||
      players.length <
      game.player_count
    ) {

      throw new Error(
        "Il faut " +
        game.player_count +
        " joueurs pour commencer."
      );

    }


    /*
      On remet les joueurs
      dans leur état de départ.
    */

    const {
      error: resetError
    } =
      await supabaseClient
        .from("players")
        .update({

          role: null,

          note: null,

          alive: true,

          eliminated: false,

          revealed: false,

          vote_for: null,

          secret_note: null,

          secret_word: null

        })
        .eq(
          "game_id",
          currentGame.id
        );


    if (resetError) {
      throw resetError;
    }


    /*
      Le serveur/jeu attribuera
      ensuite les rôles et les notes.
    */

    const {
      error: updateError
    } =
      await supabaseClient
        .from("games")
        .update({

          status: "playing",

          phase: "notes",

          current_round: 1,

          winner: null,

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          currentGame.id
        );


    if (updateError) {
      throw updateError;
    }


    currentGame = {
      ...game,

      status: "playing",

      phase: "notes",

      current_round: 1,

      winner: null

    };


    saveSession();

    goToGame();


  } catch (error) {

    console.error(
      "Erreur lancement :",
      error
    );


    setStatus(
      "❌ Impossible de lancer : " +
      error.message,
      "error"
    );


    startButton.disabled = false;

    startButton.textContent =
      "🎮 Lancer la partie";

  }

}


/* ==================================================
   ALLER AU JEU
================================================== */

function goToGame() {

  if (
    !currentGame ||
    !currentPlayer
  ) {
    return;
  }


  stopGamePolling();


  window.location.href =
    "game.html?game=" +
    encodeURIComponent(
      currentGame.id
    ) +
    "&player=" +
    encodeURIComponent(
      currentPlayer.id
    );

}


/* ==================================================
   REALTIME
================================================== */

function subscribeToRealtime() {

  if (!currentGame) {
    return;
  }


  if (realtimeGameChannel) {

    supabaseClient.removeChannel(
      realtimeGameChannel
    );

  }


  if (realtimePlayersChannel) {

    supabaseClient.removeChannel(
      realtimePlayersChannel
    );

  }


  realtimeGameChannel =
    supabaseClient
      .channel(
        "game-" +
        currentGame.id
      )
      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "games",
          filter:
            "id=eq." +
            currentGame.id
        },
        function(payload) {

          currentGame =
            payload.new;


          if (
            payload.new.status ===
            "playing"
          ) {

            saveSession();

            goToGame();

          }

        }
      )
      .subscribe();


  realtimePlayersChannel =
    supabaseClient
      .channel(
        "players-" +
        currentGame.id
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "players",
          filter:
            "game_id=eq." +
            currentGame.id
        },
        function() {

          loadPlayers();

        }
      )
      .subscribe();

}


/* ==================================================
   POLLING
================================================== */

function startGamePolling() {

  stopGamePolling();


  gamePollTimer =
    setInterval(
      checkGameStatus,
      2000
    );

}


function stopGamePolling() {

  if (gamePollTimer) {

    clearInterval(
      gamePollTimer
    );

    gamePollTimer = null;

  }

}


async function checkGameStatus() {

  if (!currentGame) {
    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "id",
          currentGame.id
        )
        .maybeSingle();


    if (error || !data) {
      return;
    }


    currentGame = data;


    if (
      data.status ===
      "playing"
    ) {

      saveSession();

      goToGame();

    }


  } catch (error) {

    console.error(
      "Polling :",
      error
    );

  }

}


/* ==================================================
   RESTAURATION DE SESSION
================================================== */

async function restoreSessionFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const gameId =
    params.get("game");

  const playerId =
    params.get("player");


  if (!gameId) {
    return false;
  }


  try {

    const {
      data: game,
      error: gameError
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "id",
          gameId
        )
        .maybeSingle();


    if (gameError) {
      throw gameError;
    }


    if (!game) {

      throw new Error(
        "Partie introuvable."
      );

    }


    let finalPlayerId =
      playerId;


    if (!finalPlayerId) {

      const saved =
        localStorage.getItem(
          "undercover_session"
        );


      if (saved) {

        try {

          const session =
            JSON.parse(saved);


          if (
            session.gameId ===
            gameId
          ) {

            finalPlayerId =
              session.playerId;

          }

        } catch (error) {}

      }

    }


    if (!finalPlayerId) {

      setStatus(
        "⚠️ Partie trouvée. Rejoins-la avec son code.",
        "error"
      );

      return false;

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .select("*")
        .eq(
          "id",
          finalPlayerId
        )
        .eq(
          "game_id",
          gameId
        )
        .maybeSingle();


    if (playerError) {
      throw playerError;
    }


    if (!player) {

      clearSession();

      throw new Error(
        "Ce joueur n'est plus dans la partie."
      );

    }


    currentGame = game;

    currentPlayer = player;


    saveSession();


    if (
      game.status ===
      "playing"
    ) {

      goToGame();

      return true;

    }


    showLobby();

    return true;


  } catch (error) {

    console.error(
      "Restauration :",
      error
    );


    setStatus(
      "❌ " +
      error.message,
      "error"
    );


    return false;

  }

}


/* ==================================================
   QUITTER
================================================== */

leaveButton.addEventListener(
  "click",
  leaveGame
);


async function leaveGame() {

  stopGamePolling();


  try {

    if (realtimeGameChannel) {

      await supabaseClient
        .removeChannel(
          realtimeGameChannel
        );

      realtimeGameChannel = null;

    }


    if (realtimePlayersChannel) {

      await supabaseClient
        .removeChannel(
          realtimePlayersChannel
        );

      realtimePlayersChannel = null;

    }


    if (currentPlayer && currentGame) {

      const {
        error
      } =
        await supabaseClient
          .from("players")
          .delete()
          .eq(
            "id",
            currentPlayer.id
          )
          .eq(
            "game_id",
            currentGame.id
          );


      if (error) {
        throw error;
      }

    }


  } catch (error) {

    console.error(
      "Erreur départ :",
      error
    );


    setStatus(
      "❌ Impossible de quitter : " +
      error.message,
      "error"
    );

    return;

  }


  clearSession();


  currentGame = null;
  currentPlayer = null;


  lobbyElement.classList.add(
    "hidden"
  );

  homeElement.classList.remove(
    "hidden"
  );


  configButton.classList.add(
    "hidden"
  );

  startButton.classList.add(
    "hidden"
  );


  setStatus(
    "👋 Tu as quitté la partie."
  );

}


/* ==================================================
   DÉMARRAGE
================================================== */

async function start() {

  try {

    const {
      error
    } =
      await supabaseClient
        .from("games")
        .select("id")
        .limit(1);


    if (error) {
      throw error;
    }


    const restored =
      await restoreSessionFromUrl();


    if (!restored) {

      setStatus(
        "✅ Supabase connecté",
        "success"
      );

    }


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Supabase : " +
      error.message,
      "error"
    );

  }

}


start();


/* ==================================================
   NETTOYAGE
================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    stopGamePolling();


    if (realtimeGameChannel) {

      supabaseClient.removeChannel(
        realtimeGameChannel
      );

    }


    if (realtimePlayersChannel) {

      supabaseClient.removeChannel(
        realtimePlayersChannel
      );

    }

  }
);
