<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undercover Notes - Multijoueur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c18;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 30px 18px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #111a2e;
      border: 1px solid #293653;
      border-radius: 18px;
      padding: 20px;
      margin: 15px 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 12px;
      border: 1px solid #293653;
      background: #090f20;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #18233a;
      border: 1px solid #293653;
    }

    #status {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: #18233a;
      margin-bottom: 15px;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .hidden {
      display: none;
    }

    .game-code {
      font-size: 42px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 8px;
      margin: 20px 0;
    }

    .player {
      padding: 12px;
      margin: 7px 0;
      background: #18233a;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<main>

  <h1>🕵️ Undercover Notes</h1>

  <div id="status">
    Connexion à Supabase...
  </div>


  <!-- ACCUEIL -->

  <section id="home">

    <div class="card">

      <h2>🎮 Créer une partie</h2>

      <input
        id="createName"
        placeholder="Ton prénom"
        maxlength="20"
      >

      <button id="createButton">
        Créer une partie
      </button>

    </div>


    <div class="card">

      <h2>👥 Rejoindre une partie</h2>

      <input
        id="joinCode"
        placeholder="Code de la partie"
        maxlength="6"
      >

      <input
        id="joinName"
        placeholder="Ton prénom"
        maxlength="20"
      >

      <button id="joinButton">
        Rejoindre
      </button>

    </div>

  </section>


  <!-- LOBBY -->

  <section id="lobby" class="hidden">

    <div class="card">

      <h2>🎮 Partie</h2>

      <div id="gameCode" class="game-code">
        ----
      </div>

      <p style="text-align:center;">
        Envoie ce code à tes amis.
      </p>

    </div>


    <div class="card">

      <h2>👥 Joueurs</h2>

      <div id="playerList">
        Aucun joueur.
      </div>

    </div>


    <button
  id="configButton"
  class="hidden"
>
  ⚙️ Configurer la partie
    </button>


    <button
      id="leaveButton"
      class="secondary"
    >
      Quitter
    </button>

  </section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://sarszeuyxrozsljhgyos.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_K_iSNYX03boGTMYWG07hfQ_TjG0FaaA";


const params =
  new URLSearchParams(
    window.location.search
  );

const gameId =
  params.get("game");

let currentGame = null;

let currentGame = null;
let currentPlayer = null;
let realtimeChannel = null;


const statusElement =
  document.getElementById("status");

const homeElement =
  document.getElementById("home");

const lobbyElement =
  document.getElementById("lobby");

const gameCodeElement =
  document.getElementById("gameCode");

const playerListElement =
  document.getElementById("playerList");

const configButton =
  document.getElementById("configButton");


function setStatus(message, type = "") {

  statusElement.textContent =
    message;

  statusElement.className =
    type;

}


function generateGameCode() {

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    code +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return code;

}


/* =========================
   CRÉER
========================= */

document
  .getElementById("createButton")
  .addEventListener(
    "click",
    createGame
  );


async function createGame() {

  const name =
    document
      .getElementById("createName")
      .value
      .trim();


  if (!name) {

    alert(
      "Entre ton prénom."
    );

    return;

  }


  setStatus(
    "Création de la partie..."
  );


  try {

    const code =
      generateGameCode();


    const {
      data: game,
      error: gameError
    } =
      await supabaseClient
        .from("games")
        .insert({

          code: code,

          max_players: 10,

          undercover_count: 1,

          status: "waiting"

        })
        .select()
        .single();


    if (gameError) {

      throw gameError;

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .insert({

          game_id: game.id,

          name: name,

          is_host: true,

          connected: true

        })
        .select()
        .single();


    if (playerError) {

      throw playerError;

    }


    currentGame = game;
    currentPlayer = player;


    showLobby();


  } catch (error) {

    console.error(error);

    setStatus(
      "Erreur : " +
      error.message,
      "error"
    );

  }

}


/* =========================
   REJOINDRE
========================= */

document
  .getElementById("joinButton")
  .addEventListener(
    "click",
    joinGame
  );


async function joinGame() {

  const code =
    document
      .getElementById("joinCode")
      .value
      .trim()
      .toUpperCase();


  const name =
    document
      .getElementById("joinName")
      .value
      .trim();


  if (!code || !name) {

    alert(
      "Entre le code et ton prénom."
    );

    return;

  }


  setStatus(
    "Recherche de la partie..."
  );


  try {

    const {
      data: game,
      error
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq("code", code)
        .maybeSingle();


    if (error) {

      throw error;

    }


    if (!game) {

      setStatus(
        "Partie introuvable.",
        "error"
      );

      return;

    }


    if (
      game.status !==
      "waiting"
    ) {

      setStatus(
        "Cette partie a déjà commencé.",
        "error"
      );

      return;

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .insert({

          game_id: game.id,

          name: name,

          is_host: false,

          connected: true

        })
        .select()
        .single();


    if (playerError) {

      throw playerError;

    }


    currentGame = game;
    currentPlayer = player;


    showLobby();


  } catch (error) {

    console.error(error);

    setStatus(
      "Erreur : " +
      error.message,
      "error"
    );

  }

}


/* =========================
   LOBBY
========================= */

function showLobby() {

  homeElement
    .classList
    .add("hidden");

  lobbyElement
    .classList
    .remove("hidden");


  gameCodeElement.textContent =
    currentGame.code;


  if (
  currentPlayer.is_host
) {

  configButton
    .classList
    .remove("hidden");

  }


  setStatus(
    "Supabase connecté ✅",
    "success"
  );


  loadPlayers();

  subscribeToGame();

}


/* =========================
   JOUEURS
========================= */

async function loadPlayers() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .select("*")
      .eq(
        "game_id",
        currentGame.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    return;

  }


  renderPlayers(data);

}


function renderPlayers(players) {

  if (!players.length) {

    playerListElement.textContent =
      "Aucun joueur.";

    return;

  }


  playerListElement.innerHTML =
    players
      .map(
        function(player) {

          return `

            <div class="player">

              🟢
              ${escapeHTML(
                player.name
              )}

              ${
                player.is_host
                  ? " 👑"
                  : ""
              }

            </div>

          `;

        }
      )
      .join("");

}


function escapeHTML(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      function(char) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[char];

      }
    );

}

configButton.addEventListener(
  "click",
  function() {

    if (
      !currentPlayer ||
      !currentPlayer.is_host ||
      !currentGame
    ) {
      return;
    }

    window.location.href =
      "config.html?game=" +
      encodeURIComponent(currentGame.id);

  }
);

    window.location.href =
      "config.html";

  }
);
/* =========================
   TEMPS RÉEL
========================= */

function subscribeToGame() {

  if (realtimeChannel) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "game-" +
        currentGame.id
      )

      .on(

        "postgres_changes",

        {
          event: "*",
          schema: "public",
          table: "players",
          filter:
            "game_id=eq." +
            currentGame.id
        },

        function() {

          loadPlayers();

        }

      )

      .on(

        "postgres_changes",

        {
          event: "UPDATE",
          schema: "public",
          table: "games",
          filter:
            "id=eq." +
            currentGame.id
        },

        function(payload) {

          currentGame =
            payload.new;

          if (
            currentGame.status ===
            "playing"
          ) {

            setStatus(
              "La partie commence !",
              "success"
            );

          }

        }

      )

      .subscribe(

        function(status) {

          console.log(
            "Realtime:",
            status
          );

        }

      );

}


/* =========================
   LANCER
========================= */

startButton
  .addEventListener(
    "click",
    startOnlineGame
  );


async function startOnlineGame() {

  if (
    !currentPlayer ||
    !currentPlayer.is_host
  ) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("games")
      .update({

        status: "playing",

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        currentGame.id
      );


  if (error) {

    console.error(error);

    setStatus(
      "Erreur au lancement : " +
      error.message,
      "error"
    );

    return;

  }


  setStatus(
    "Partie lancée !",
    "success"
  );

}


/* =========================
   QUITTER
========================= */

document
  .getElementById("leaveButton")
  .addEventListener(
    "click",
    async function() {

      if (
        currentPlayer
      ) {

        await supabaseClient
          .from("players")
          .delete()
          .eq(
            "id",
            currentPlayer.id
          );

      }


      if (
        realtimeChannel
      ) {

        await supabaseClient
          .removeChannel(
            realtimeChannel
          );

      }


      currentGame = null;
      currentPlayer = null;
      realtimeChannel = null;


      lobbyElement
        .classList
        .add("hidden");

      homeElement
        .classList
        .remove("hidden");


      setStatus(
        "Prêt à jouer."
      );

    }
  );

</script>

</body>
</html>
