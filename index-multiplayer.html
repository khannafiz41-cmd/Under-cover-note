<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Undercover Notes - Multijoueur</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c18;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
    }

    .card {
      background: #111a2e;
      border: 1px solid #293653;
      border-radius: 18px;
      padding: 20px;
      margin: 15px 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 12px;
      border: 1px solid #293653;
      background: #090f20;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #18233a;
      border: 1px solid #293653;
    }

    button.green {
      background: #16a34a;
    }

    button.red {
      background: #dc2626;
    }

    button.small {
      width: auto;
      padding: 8px 12px;
      margin: 0;
      font-size: 13px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: #18233a;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .hidden {
      display: none !important;
    }

    .game-code {
      font-size: 42px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 8px;
      margin: 20px 0;
    }

    .player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      margin: 7px 0;
      background: #18233a;
      border-radius: 10px;
    }

    .player-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-count {
      text-align: center;
      color: #cbd5e1;
      margin-top: 10px;
    }

  </style>

</head>

<body>

<main>

  <h1>🕵️ Undercover Notes</h1>

  <div id="status">
    Connexion à Supabase...
  </div>


  <!-- ================================================= -->
  <!-- ACCUEIL -->
  <!-- ================================================= -->

  <section id="home">

    <div class="card">

      <h2>🎮 Créer une partie</h2>

      <input
        id="createName"
        placeholder="Ton prénom"
        maxlength="20"
        autocomplete="off"
      >

      <button id="createButton">
        Créer une partie
      </button>

    </div>


    <div class="card">

      <h2>👥 Rejoindre une partie</h2>

      <input
        id="joinCode"
        placeholder="Code de la partie"
        maxlength="4"
        autocomplete="off"
      >

      <input
        id="joinName"
        placeholder="Ton prénom"
        maxlength="20"
        autocomplete="off"
      >

      <button id="joinButton">
        Rejoindre
      </button>

    </div>

  </section>


  <!-- ================================================= -->
  <!-- LOBBY -->
  <!-- ================================================= -->

  <section
    id="lobby"
    class="hidden"
  >

    <div class="card">

      <h2>🎮 Partie</h2>

      <div
        id="gameCode"
        class="game-code"
      >
        ----
      </div>

      <p style="text-align:center;">
        Envoie ce code à tes amis.
      </p>

      <div
        id="playerCount"
        class="player-count"
      >
        0 joueur
      </div>

    </div>


    <div class="card">

      <h2>👥 Joueurs</h2>

      <div id="playerList">
        Aucun joueur.
      </div>

    </div>


    <button
      id="configButton"
      class="hidden"
    >
      ⚙️ Configurer la partie
    </button>


    <button
      id="startButton"
      class="hidden green"
    >
      🎮 Lancer la partie
    </button>


    <button
      id="leaveButton"
      class="secondary"
    >
      ← Quitter le lobby
    </button>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://sarszeuyxrozsljhgyos.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_K_iSNYX03boGTMYWG07hfQ_TjG0FaaA";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let currentGame = null;
let currentPlayer = null;

let realtimeGameChannel = null;
let realtimePlayersChannel = null;

let gamePollTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const statusElement =
  document.getElementById("status");

const homeElement =
  document.getElementById("home");

const lobbyElement =
  document.getElementById("lobby");

const gameCodeElement =
  document.getElementById("gameCode");

const playerListElement =
  document.getElementById("playerList");

const playerCountElement =
  document.getElementById("playerCount");

const configButton =
  document.getElementById("configButton");

const startButton =
  document.getElementById("startButton");

const leaveButton =
  document.getElementById("leaveButton");

const createButton =
  document.getElementById("createButton");

const joinButton =
  document.getElementById("joinButton");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message, type = "") {

  statusElement.textContent = message;

  statusElement.className = type;

}


/* =========================================================
   CODE PARTIE
========================================================= */

function generateGameCode() {

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (let i = 0; i < 4; i++) {

    code +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return code;

}


/* =========================================================
   SESSION
========================================================= */

function saveSession() {

  if (!currentGame || !currentPlayer) {
    return;
  }

  localStorage.setItem(
    "undercover_session",
    JSON.stringify({
      gameId: currentGame.id,
      playerId: currentPlayer.id
    })
  );

}


function clearSession() {

  localStorage.removeItem(
    "undercover_session"
  );

}


/* =========================================================
   CREER PARTIE
========================================================= */

createButton.addEventListener(
  "click",
  createGame
);


async function createGame() {

  const name =
    document
      .getElementById("createName")
      .value
      .trim();


  if (!name) {

    setStatus(
      "❌ Entre ton prénom.",
      "error"
    );

    return;

  }


  createButton.disabled = true;

  createButton.textContent =
    "Création...";


  setStatus(
    "Création de la partie..."
  );


  try {

    let code = generateGameCode();

    let game = null;

    /*
      On évite autant que possible
      les doublons de code.
    */

    for (let attempt = 0; attempt < 10; attempt++) {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("games")
          .insert({

            code: code,

            max_players: 10,

            player_count: 3,

            undercover_count: 1,

            topic: null,

            difficulty: "easy",

            status: "waiting",

            phase: null,

            current_round: 1,

            winner: null

          })
          .select()
          .single();


      if (!error) {

        game = data;

        break;

      }


      if (
        error.code !== "23505"
      ) {

        throw error;

      }


      code = generateGameCode();

    }


    if (!game) {

      throw new Error(
        "Impossible de créer le code de partie."
      );

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .insert({

          game_id: game.id,

          name: name,

          is_host: true,

          connected: true,

          alive: true,

          eliminated: false,

          revealed: false,

          vote_for: null,

          role: null,

          note: null,

          secret_note: null

        })
        .select()
        .single();


    if (playerError) {
      throw playerError;
    }


    currentGame = game;

    currentPlayer = player;


    saveSession();

    showLobby();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Erreur : " +
      error.message,
      "error"
    );

  }


  createButton.disabled = false;

  createButton.textContent =
    "Créer une partie";

}


/* =========================================================
   REJOINDRE PARTIE
========================================================= */

joinButton.addEventListener(
  "click",
  joinGame
);


async function joinGame() {

  const code =
    document
      .getElementById("joinCode")
      .value
      .trim()
      .toUpperCase();


  const name =
    document
      .getElementById("joinName")
      .value
      .trim();


  if (!code || !name) {

    setStatus(
      "❌ Entre le code et ton prénom.",
      "error"
    );

    return;

  }


  joinButton.disabled = true;

  joinButton.textContent =
    "Recherche...";


  setStatus(
    "Recherche de la partie..."
  );


  try {

    const {
      data: game,
      error
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "code",
          code
        )
        .maybeSingle();


    if (error) {
      throw error;
    }


    if (!game) {

      setStatus(
        "❌ Partie introuvable.",
        "error"
      );

      return;

    }


    if (game.status !== "waiting") {

      setStatus(
        "❌ Cette partie a déjà commencé.",
        "error"
      );

      return;

    }


    const {
      count,
      error: countError
    } =
      await supabaseClient
        .from("players")
        .select(
          "id",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "game_id",
          game.id
        );


    if (countError) {
      throw countError;
    }


    /*
      player_count = nombre de joueurs
      nécessaire pour lancer.

      max_players = sécurité maximale.
    */

    const requiredPlayers =
      Number(
        game.player_count ||
        3
      );

    const maxPlayers =
      Number(
        game.max_players ||
        10
      );


    if (count >= maxPlayers) {

      setStatus(
        "❌ La partie est complète.",
        "error"
      );

      return;

    }


    if (count >= requiredPlayers) {

      setStatus(
        "❌ Le nombre de joueurs configuré est déjà atteint.",
        "error"
      );

      return;

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .insert({

          game_id: game.id,

          name: name,

          is_host: false,

          connected: true,

          alive: true,

          eliminated: false,

          revealed: false,

          vote_for: null,

          role: null,

          note: null,

          secret_note: null

        })
        .select()
        .single();


    if (playerError) {
      throw playerError;
    }


    currentGame = game;

    currentPlayer = player;


    saveSession();

    showLobby();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Erreur : " +
      error.message,
      "error"
    );

  }


  joinButton.disabled = false;

  joinButton.textContent =
    "Rejoindre";

}


/* =========================================================
   AFFICHER LOBBY
========================================================= */

function showLobby() {

  homeElement.classList.add("hidden");

  lobbyElement.classList.remove("hidden");


  gameCodeElement.textContent =
    currentGame.code;


  if (
    currentPlayer &&
    currentPlayer.is_host
  ) {

    configButton.classList.remove(
      "hidden"
    );

    startButton.classList.remove(
      "hidden"
    );

  } else {

    configButton.classList.add(
      "hidden"
    );

    startButton.classList.add(
      "hidden"
    );

  }


  setStatus(
    "✅ Lobby chargé",
    "success"
  );


  loadPlayers();

  subscribeToRealtime();

  startGamePolling();

}


/* =========================================================
   CHARGER JOUEURS
========================================================= */

async function loadPlayers() {

  if (!currentGame) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .select("*")
      .eq(
        "game_id",
        currentGame.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Erreur joueurs :",
      error
    );

    return;

  }


  renderPlayers(
    data || []
  );

}


/* =========================================================
   AFFICHER JOUEURS
========================================================= */

function renderPlayers(players) {

  playerCountElement.textContent =
    players.length +
    " / " +
    (
      currentGame?.player_count ||
      "?"
    ) +
    " joueur(s)";


  if (!players.length) {

    playerListElement.textContent =
      "Aucun joueur.";

    return;

  }


  playerListElement.innerHTML =
    players
      .map(function(player) {

        const isMe =
          currentPlayer &&
          player.id ===
          currentPlayer.id;


        const kickButton =
          currentPlayer &&
          currentPlayer.is_host &&
          !player.is_host &&
          !isMe
            ? `
              <button
                class="red small"
                onclick="kickPlayer('${player.id}')"
              >
                🚫 Exclure
              </button>
            `
            : "";


        return `
          <div class="player">

            <span class="player-name">

              🟢
              ${escapeHTML(player.name)}

              ${
                player.is_host
                  ? " 👑"
                  : ""
              }

              ${
                isMe
                  ? " (toi)"
                  : ""
              }

            </span>

            ${kickButton}

          </div>
        `;

      })
      .join("");

}


/* =========================================================
   PROTECTION HTML
========================================================= */

function escapeHTML(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      function(char) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[char];

      }
    );

}


/* =========================================================
   EXCLURE JOUEUR
========================================================= */

async function kickPlayer(playerId) {

  if (
    !currentGame ||
    !currentPlayer ||
    !currentPlayer.is_host
  ) {
    return;
  }


  if (
    !confirm(
      "Voulez-vous vraiment exclure ce joueur ?"
    )
  ) {
    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("players")
        .delete()
        .eq(
          "id",
          playerId
        )
        .eq(
          "game_id",
          currentGame.id
        );


    if (error) {
      throw error;
    }


    setStatus(
      "🚫 Joueur exclu.",
      "success"
    );


    await loadPlayers();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Impossible d'exclure : " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   CONFIGURATION
========================================================= */

configButton.addEventListener(
  "click",
  function() {

    if (
      !currentGame ||
      !currentPlayer ||
      !currentPlayer.is_host
    ) {
      return;
    }


    window.location.href =
      "config.html?game=" +
      encodeURIComponent(
        currentGame.id
      ) +
      "&player=" +
      encodeURIComponent(
        currentPlayer.id
      );

  }
);


/* =========================================================
   DISTRIBUTION DES ROLES
========================================================= */

async function distributeRolesForGame(
  game,
  gamePlayers
) {

  if (
    !game ||
    !gamePlayers ||
    gamePlayers.length < 2
  ) {

    throw new Error(
      "Il faut au moins 2 joueurs."
    );

  }


  const undercoverCount =
    Math.max(
      1,
      Math.min(
        Number(
          game.undercover_count ||
          1
        ),
        gamePlayers.length - 1
      )
    );


  /*
    Mélange fiable pour un petit groupe.
  */

  const shuffled =
    [...gamePlayers]
      .sort(
        () => Math.random() - 0.5
      );


  const undercoverIds =
    shuffled
      .slice(
        0,
        undercoverCount
      )
      .map(
        player => player.id
      );


  /*
    Notes configurées dans la partie.
    Si elles sont absentes, valeurs par défaut.
  */

  const normalNote =
    game.normal_note ??
    game.village_note ??
    1;


  const undercoverNote =
    game.undercover_note ??
    0;


  /*
    Attribution joueur par joueur.
  */

  for (
    const player of gamePlayers
  ) {

    const isUndercover =
      undercoverIds.includes(
        player.id
      );


    const role =
      isUndercover
        ? "undercover"
        : "civil";


    const note =
      isUndercover
        ? undercoverNote
        : normalNote;


    const {
      error
    } =
      await supabaseClient
        .from("players")
        .update({

          role: role,

          note: note,

          secret_note: note,

          alive: true,

          eliminated: false,

          revealed: false,

          vote_for: null

        })
        .eq(
          "id",
          player.id
        )
        .eq(
          "game_id",
          game.id
        );


    if (error) {
      throw error;
    }

  }

}


/* =========================================================
   LANCER PARTIE
========================================================= */

startButton.addEventListener(
  "click",
  startGame
);


async function startGame() {

  if (
    !currentGame ||
    !currentPlayer ||
    !currentPlayer.is_host
  ) {
    return;
  }


  startButton.disabled = true;

  startButton.textContent =
    "🎮 Lancement...";


  try {

    /*
      1. On relit la partie.
    */

    const {
      data: game,
      error: gameError
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "id",
          currentGame.id
        )
        .maybeSingle();


    if (gameError) {
      throw gameError;
    }


    if (!game) {

      throw new Error(
        "Partie introuvable."
      );

    }


    /*
      2. On récupère les joueurs.
    */

    const {
      data: gamePlayers,
      error: playersError
    } =
      await supabaseClient
        .from("players")
        .select("*")
        .eq(
          "game_id",
          game.id
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (playersError) {
      throw playersError;
    }


    const requiredPlayers =
      Number(
        game.player_count ||
        3
      );


    if (
      !gamePlayers ||
      gamePlayers.length <
      requiredPlayers
    ) {

      throw new Error(
        "Il faut " +
        requiredPlayers +
        " joueurs pour commencer. " +
        "Actuellement : " +
        (gamePlayers?.length || 0) +
        "."
      );

    }


    if (
      gamePlayers.length >
      Number(game.max_players || 10)
    ) {

      throw new Error(
        "Trop de joueurs dans la partie."
      );

    }


    const undercoverCount =
      Number(
        game.undercover_count ||
        1
      );


    if (
      undercoverCount >=
      gamePlayers.length
    ) {

      throw new Error(
        "Il faut au moins un joueur classique."
      );

    }


    /*
      3. Attribution AVANT de lancer
         la phase reveal.
    */

    await distributeRolesForGame(
      game,
      gamePlayers
    );


    /*
      4. On met le jeu directement
         en phase reveal.
    */

    const {
      data: updatedGame,
      error: updateError
    } =
      await supabaseClient
        .from("games")
        .update({

          status: "playing",

          phase: "reveal",

          current_round: 1,

          winner: null,

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          game.id
        )
        .select()
        .single();


    if (updateError) {
      throw updateError;
    }


    currentGame =
      updatedGame;


    saveSession();


    /*
      5. Tout le monde va recevoir
         le changement Realtime.
         L'hôte peut aussi aller
         directement au jeu.
    */

    goToGame();


  } catch (error) {

    console.error(
      "Erreur lancement :",
      error
    );


    setStatus(
      "❌ Impossible de lancer : " +
      error.message,
      "error"
    );


    startButton.disabled = false;

    startButton.textContent =
      "🎮 Lancer la partie";

  }

}


/* =========================================================
   ALLER AU JEU
========================================================= */

function goToGame() {

  if (
    !currentGame ||
    !currentPlayer
  ) {
    return;
  }


  stopGamePolling();


  window.location.href =
    "game.html?game=" +
    encodeURIComponent(
      currentGame.id
    ) +
    "&player=" +
    encodeURIComponent(
      currentPlayer.id
    );

}


/* =========================================================
   REALTIME
========================================================= */

function subscribeToRealtime() {

  if (!currentGame) {
    return;
  }


  if (realtimeGameChannel) {

    supabaseClient.removeChannel(
      realtimeGameChannel
    );

  }


  if (realtimePlayersChannel) {

    supabaseClient.removeChannel(
      realtimePlayersChannel
    );

  }


  realtimeGameChannel =
    supabaseClient
      .channel(
        "game-status-" +
        currentGame.id +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "games",
          filter:
            "id=eq." +
            currentGame.id
        },
        function(payload) {

          currentGame =
            payload.new;


          if (
            payload.new.status ===
            "playing"
          ) {

            saveSession();

            goToGame();

          }

        }
      )
      .subscribe();


  realtimePlayersChannel =
    supabaseClient
      .channel(
        "players-" +
        currentGame.id +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "players",
          filter:
            "game_id=eq." +
            currentGame.id
        },
        function() {

          loadPlayers();

        }
      )
      .subscribe();

}


/* =========================================================
   POLLING
========================================================= */

function startGamePolling() {

  stopGamePolling();


  gamePollTimer =
    setInterval(
      checkGameStatus,
      2000
    );

}


function stopGamePolling() {

  if (gamePollTimer) {

    clearInterval(
      gamePollTimer
    );

    gamePollTimer = null;

  }

}


async function checkGameStatus() {

  if (!currentGame) {
    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "id",
          currentGame.id
        )
        .maybeSingle();


    if (error || !data) {
      return;
    }


    currentGame =
      data;


    if (
      data.status ===
      "playing"
    ) {

      saveSession();

      goToGame();

    }


  } catch (error) {

    console.error(
      "Polling :",
      error
    );

  }

}


/* =========================================================
   RESTAURATION SESSION
========================================================= */

async function restoreSessionFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const gameId =
    params.get("game");

  const playerId =
    params.get("player");


  if (!gameId) {
    return false;
  }


  try {

    const {
      data: game,
      error: gameError
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "id",
          gameId
        )
        .maybeSingle();


    if (gameError) {
      throw gameError;
    }


    if (!game) {

      throw new Error(
        "Partie introuvable."
      );

    }


    let finalPlayerId =
      playerId;


    if (!finalPlayerId) {

      const saved =
        localStorage.getItem(
          "undercover_session"
        );


      if (saved) {

        try {

          const session =
            JSON.parse(saved);


          if (
            session.gameId ===
            gameId
          ) {

            finalPlayerId =
              session.playerId;

          }

        } catch (error) {

          console.warn(
            "Session locale invalide."
          );

        }

      }

    }


    if (!finalPlayerId) {

      return false;

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .select("*")
        .eq(
          "id",
          finalPlayerId
        )
        .eq(
          "game_id",
          gameId
        )
        .maybeSingle();


    if (playerError) {
      throw playerError;
    }


    if (!player) {

      clearSession();

      throw new Error(
        "Ce joueur n'est plus dans la partie."
      );

    }


    currentGame =
      game;

    currentPlayer =
      player;


    saveSession();


    if (
      game.status ===
      "playing"
    ) {

      goToGame();

      return true;

    }


    showLobby();

    return true;


  } catch (error) {

    console.error(
      "Restauration :",
      error
    );


    setStatus(
      "❌ " +
      error.message,
      "error"
    );


    return false;

  }

}


/* =========================================================
   QUITTER
========================================================= */

leaveButton.addEventListener(
  "click",
  leaveGame
);


async function leaveGame() {

  stopGamePolling();


  try {

    if (realtimeGameChannel) {

      await supabaseClient
        .removeChannel(
          realtimeGameChannel
        );

      realtimeGameChannel = null;

    }


    if (realtimePlayersChannel) {

      await supabaseClient
        .removeChannel(
          realtimePlayersChannel
        );

      realtimePlayersChannel = null;

    }


    if (
      currentPlayer &&
      currentGame
    ) {

      const {
        error
      } =
        await supabaseClient
          .from("players")
          .delete()
          .eq(
            "id",
            currentPlayer.id
          )
          .eq(
            "game_id",
            currentGame.id
          );


      if (error) {
        throw error;
      }

    }


  } catch (error) {

    console.error(
      "Erreur départ :",
      error
    );


    setStatus(
      "❌ Impossible de quitter : " +
      error.message,
      "error"
    );

    return;

  }


  clearSession();


  currentGame = null;
  currentPlayer = null;


  lobbyElement.classList.add(
    "hidden"
  );

  homeElement.classList.remove(
    "hidden"
  );


  configButton.classList.add(
    "hidden"
  );

  startButton.classList.add(
    "hidden"
  );


  setStatus(
    "👋 Tu as quitté la partie."
  );

}


/* =========================================================
   DEMARRAGE
========================================================= */

async function start() {

  try {

    const {
      error
    } =
      await supabaseClient
        .from("games")
        .select("id")
        .limit(1);


    if (error) {
      throw error;
    }


    const restored =
      await restoreSessionFromUrl();


    if (!restored) {

      setStatus(
        "✅ Supabase connecté",
        "success"
      );

    }


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Supabase : " +
      error.message,
      "error"
    );

  }

}


start();


/* =========================================================
   NETTOYAGE
========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    stopGamePolling();


    if (realtimeGameChannel) {

      supabaseClient.removeChannel(
        realtimeGameChannel
      );

    }


    if (realtimePlayersChannel) {

      supabaseClient.removeChannel(
        realtimePlayersChannel
      );

    }

  }
);

</script>
