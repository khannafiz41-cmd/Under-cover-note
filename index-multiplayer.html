<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Undercover Notes - Multijoueur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c18;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: #111a2e;
      border: 1px solid #293653;
      border-radius: 18px;
      padding: 20px;
      margin: 15px 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 12px;
      border: 1px solid #293653;
      background: #090f20;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #18233a;
      border: 1px solid #293653;
    }

    button.green {
      background: #16a34a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: #18233a;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .hidden {
      display: none;
    }

    .game-code {
      font-size: 42px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 8px;
      margin: 20px 0;
    }

    .player {
      padding: 12px;
      margin: 7px 0;
      background: #18233a;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<main>

  <h1>🕵️ Undercover Notes</h1>

  <div id="status">
    Connexion à Supabase...
  </div>


  <!-- ACCUEIL -->

  <section id="home">

    <div class="card">

      <h2>🎮 Créer une partie</h2>

      <input
        id="createName"
        placeholder="Ton prénom"
        maxlength="20"
      >

      <button id="createButton">
        Créer une partie
      </button>

    </div>


    <div class="card">

      <h2>👥 Rejoindre une partie</h2>

      <input
        id="joinCode"
        placeholder="Code de la partie"
        maxlength="6"
      >

      <input
        id="joinName"
        placeholder="Ton prénom"
        maxlength="20"
      >

      <button id="joinButton">
        Rejoindre
      </button>

    </div>

  </section>


  <!-- LOBBY -->

  <section
    id="lobby"
    class="hidden"
  >

    <div class="card">

      <h2>🎮 Partie</h2>

      <div
        id="gameCode"
        class="game-code"
      >
        ----
      </div>

      <p style="text-align:center;">
        Envoie ce code à tes amis.
      </p>

    </div>


    <div class="card">

      <h2>👥 Joueurs</h2>

      <div id="playerList">
        Aucun joueur.
      </div>

    </div>


    <button
      id="configButton"
      class="hidden"
    >
      ⚙️ Configurer la partie
    </button>


    <button
      id="startButton"
      class="hidden green"
    >
      🎮 Lancer la partie
    </button>


    <button
      id="leaveButton"
      class="secondary"
    >
      ← Quitter le lobby
    </button>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://sarszeuyxrozsljhgyos.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_K_iSNYX03boGTMYWG07hfQ_TjG0FaaA";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   VARIABLES
================================================== */

let currentGame = null;
let currentPlayer = null;
let realtimeChannel = null;


/* ==================================================
   ÉLÉMENTS
================================================== */

const statusElement =
  document.getElementById("status");

const homeElement =
  document.getElementById("home");

const lobbyElement =
  document.getElementById("lobby");

const gameCodeElement =
  document.getElementById("gameCode");

const playerListElement =
  document.getElementById("playerList");

const configButton =
  document.getElementById("configButton");

const startButton =
  document.getElementById("startButton");

const leaveButton =
  document.getElementById("leaveButton");


/* ==================================================
   STATUS
================================================== */

function setStatus(message, type = "") {

  statusElement.textContent =
    message;

  statusElement.className =
    type;

}


/* ==================================================
   CODE DE PARTIE
================================================== */

function generateGameCode() {

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    code +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return code;

}


/* ==================================================
   CRÉER UNE PARTIE
================================================== */

document
  .getElementById("createButton")
  .addEventListener(
    "click",
    createGame
  );


async function createGame() {

  const name =
    document
      .getElementById("createName")
      .value
      .trim();


  if (!name) {

    setStatus(
      "❌ Entre ton prénom.",
      "error"
    );

    return;

  }


  setStatus(
    "Création de la partie..."
  );


  try {

    const code =
      generateGameCode();


    const {
      data: game,
      error: gameError
    } =
      await supabaseClient
        .from("games")
        .insert({

          code: code,
          max_players: 10,
          undercover_count: 1,
          player_count: 3,
          topic: null,
          status: "waiting"

        })
        .select()
        .single();


    if (gameError) {

      throw gameError;

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .insert({

          game_id: game.id,
          name: name,
          is_host: true,
          connected: true

        })
        .select()
        .single();


    if (playerError) {

      throw playerError;

    }


    currentGame =
      game;

    currentPlayer =
      player;


    showLobby();


  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Erreur : " +
      error.message,
      "error"
    );

  }

}


/* ==================================================
   REJOINDRE
================================================== */

document
  .getElementById("joinButton")
  .addEventListener(
    "click",
    joinGame
  );


async function joinGame() {

  const code =
    document
      .getElementById("joinCode")
      .value
      .trim()
      .toUpperCase();


  const name =
    document
      .getElementById("joinName")
      .value
      .trim();


  if (!code || !name) {

    setStatus(
      "❌ Entre le code et ton prénom.",
      "error"
    );

    return;

  }


  setStatus(
    "Recherche de la partie..."
  );


  try {

    const {
      data: game,
      error
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "code",
          code
        )
        .maybeSingle();


    if (error) {

      throw error;

    }


    if (!game) {

      setStatus(
        "❌ Partie introuvable.",
        "error"
      );

      return;

    }


    if (
      game.status !==
      "waiting"
    ) {

      setStatus(
        "❌ Cette partie a déjà commencé.",
        "error"
      );

      return;

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .insert({

          game_id: game.id,
          name: name,
          is_host: false,
          connected: true

        })
        .select()
        .single();


    if (playerError) {

      throw playerError;

    }


    currentGame =
      game;

    currentPlayer =
      player;


    showLobby();


  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Erreur : " +
      error.message,
      "error"
    );

  }

}


/* ==================================================
   AFFICHER LE LOBBY
================================================== */

function showLobby() {

  homeElement
    .classList
    .add("hidden");

  lobbyElement
    .classList
    .remove("hidden");


  gameCodeElement.textContent =
    currentGame.code;


  if (
    currentPlayer &&
    currentPlayer.is_host
  ) {

    configButton
      .classList
      .remove("hidden");

    startButton
      .classList
      .remove("hidden");

  } else {

    configButton
      .classList
      .add("hidden");

    startButton
      .classList
      .add("hidden");

  }


  setStatus(
    "✅ Supabase connecté",
    "success"
  );


  loadPlayers();

  subscribeToGame();

}


/* ==================================================
   CHARGER LES JOUEURS
================================================== */

async function loadPlayers() {

  if (!currentGame) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .select("*")
      .eq(
        "game_id",
        currentGame.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    return;

  }


  renderPlayers(data);

}


/* ==================================================
   AFFICHER LES JOUEURS
================================================== */

function renderPlayers(players) {

  if (
    !players ||
    players.length === 0
  ) {

    playerListElement.textContent =
      "Aucun joueur.";

    return;

  }


  playerListElement.innerHTML =
    players
      .map(function(player) {

        return `
          <div class="player">
            🟢 ${escapeHTML(player.name)}
            ${
              player.is_host
                ? " 👑"
                : ""
            }
          </div>
        `;

      })
      .join("");

}


function escapeHTML(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      function(char) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[char];

      }
    );

}


/* ==================================================
   CONFIGURATION
================================================== */

configButton.addEventListener(
  "click",
  function() {

    if (
      !currentGame ||
      !currentPlayer ||
      !currentPlayer.is_host
    ) {

      return;

    }


    window.location.href =
      "config.html?game=" +
      encodeURIComponent(
        currentGame.id
      );

  }
);


/* ==================================================
   TEMPS RÉEL
================================================== */

function subscribeToGame() {

  if (!currentGame) {
    return;
  }


  if (realtimeChannel) {

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "game-" +
        currentGame.id
      )

      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "players",
          filter:
            "game_id=eq." +
            currentGame.id
        },
        function() {

          loadPlayers();

        }
      )

      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "games",
          filter:
            "id=eq." +
            currentGame.id
        },
        function(payload) {

          currentGame =
            payload.new;


          if (
  currentGame.status ===
  "playing"
) {

  setStatus(
    "🎮 La partie commence !",
    "success"
  );

  window.location.href =
    "game.html?game=" +
    encodeURIComponent(currentGame.id) +
    "&player=" +
    encodeURIComponent(currentPlayer.id);

          }

        }
      )

      .subscribe(
        function(channelStatus) {

          console.log(
            "Realtime :",
            channelStatus
          );

        }
      );

}


/* ==================================================
   LANCER LA PARTIE
================================================== */

startButton.addEventListener(
  "click",
  startGame
);


async function startGame() {

  if (
    !currentGame ||
    !currentPlayer ||
    !currentPlayer.is_host
  ) {

    return;

  }


  startButton.disabled = true;

  startButton.textContent =
    "🎮 Lancement...";


  try {

    /*
      On relit la configuration
      avant de lancer.
    */

    const {
      data: game,
      error: loadError
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "id",
          currentGame.id
        )
        .single();


    if (loadError) {

      throw loadError;

    }


    if (
      !game.player_count ||
      !game.undercover_count
    ) {

      throw new Error(
        "Configure d'abord la partie."
      );

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("games")
        .update({

          status: "playing",

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          currentGame.id
        )
        .select()
        .single();


    if (error) {

      throw error;

    }


    currentGame =
      data;


    setStatus(
      "🎮 Partie lancée !",
      "success"
    );


    startButton.textContent =
      "🎮 Partie lancée";

  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Erreur au lancement : " +
      error.message,
      "error"
    );


    startButton.disabled =
      false;

    startButton.textContent =
      "🎮 Lancer la partie";

  }

}


/* ==================================================
   QUITTER
================================================== */

leaveButton.addEventListener(
  "click",
  leaveGame
);


async function leaveGame() {

  try {

    if (currentPlayer) {

      const {
        error
      } =
        await supabaseClient
          .from("players")
          .delete()
          .eq(
            "id",
            currentPlayer.id
          );


      if (error) {

        console.error(error);

      }

    }


    if (realtimeChannel) {

      await supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }

  } catch (error) {

    console.error(error);

  }


  currentGame = null;
  currentPlayer = null;
  realtimeChannel = null;


  lobbyElement
    .classList
    .add("hidden");

  homeElement
    .classList
    .remove("hidden");


  configButton
    .classList
    .add("hidden");

  startButton
    .classList
    .add("hidden");


  setStatus(
    "Prêt à jouer."
  );

}


/* ==================================================
   TEST SUPABASE
================================================== */

async function testSupabase() {

  try {

    const {
      error
    } =
      await supabaseClient
        .from("games")
        .select("id")
        .limit(1);


    if (error) {

      console.error(error);

      setStatus(
        "❌ Supabase : " +
        error.message,
        "error"
      );

      return;

    }


    setStatus(
      "✅ Supabase connecté",
      "success"
    );


  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Erreur Supabase : " +
      error.message,
      "error"
    );

  }

}


/* ==================================================
   DÉMARRAGE
================================================== */

testSupabase();

</script>

</body>
</html>
