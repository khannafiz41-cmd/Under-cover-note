<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Undercover Notes - Multijoueur</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c18;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: #111a2e;
      border: 1px solid #293653;
      border-radius: 18px;
      padding: 20px;
      margin: 15px 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 12px;
      border: 1px solid #293653;
      background: #090f20;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #18233a;
      border: 1px solid #293653;
    }

    button.green {
      background: #16a34a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: #18233a;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .hidden {
      display: none;
    }

    .game-code {
      font-size: 42px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 8px;
      margin: 20px 0;
    }

    .player {
      padding: 12px;
      margin: 7px 0;
      background: #18233a;
      border-radius: 10px;
    }

    .config-info {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #18233a;
      line-height: 1.7;
    }

  </style>

</head>

<body>

<main>

  <h1>🕵️ Undercover Notes</h1>

  <div id="status">
    Connexion à Supabase...
  </div>


  <!-- ACCUEIL -->

  <section id="home">

    <div class="card">

      <h2>🎮 Créer une partie</h2>

      <input
        id="createName"
        placeholder="Ton prénom"
        maxlength="20"
      >

      <button id="createButton">
        Créer une partie
      </button>

    </div>


    <div class="card">

      <h2>👥 Rejoindre une partie</h2>

      <input
        id="joinCode"
        placeholder="Code de la partie"
        maxlength="6"
      >

      <input
        id="joinName"
        placeholder="Ton prénom"
        maxlength="20"
      >

      <button id="joinButton">
        Rejoindre
      </button>

    </div>

  </section>


  <!-- LOBBY -->

  <section
    id="lobby"
    class="hidden"
  >

    <div class="card">

      <h2>🎮 Partie</h2>

      <div
        id="gameCode"
        class="game-code"
      >
        ----
      </div>

      <p style="text-align:center;">
        Envoie ce code à tes amis.
      </p>

      <div
        id="configInfo"
        class="config-info"
      >
        ⚙️ Configuration en cours...
      </div>

    </div>


    <div class="card">

      <h2>👥 Joueurs</h2>

      <div id="playerList">
        Aucun joueur.
      </div>

    </div>


    <button
      id="configButton"
      class="hidden"
    >
      ⚙️ Configurer la partie
    </button>


    <button
      id="startButton"
      class="hidden green"
    >
      🎮 Lancer la partie
    </button>


    <button
      id="leaveButton"
      class="secondary"
    >
      ← Quitter le lobby
    </button>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://sarszeuyxrozsljhgyos.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_K_iSNYX03boGTMYWG07hfQ_TjG0FaaA";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentGame = null;
let currentPlayer = null;

let realtimeChannel = null;
let playersChannel = null;

let gamePollTimer = null;
let redirecting = false;


const statusElement =
  document.getElementById("status");

const homeElement =
  document.getElementById("home");

const lobbyElement =
  document.getElementById("lobby");

const gameCodeElement =
  document.getElementById("gameCode");

const playerListElement =
  document.getElementById("playerList");

const configInfoElement =
  document.getElementById("configInfo");

const configButton =
  document.getElementById("configButton");

const startButton =
  document.getElementById("startButton");

const leaveButton =
  document.getElementById("leaveButton");


function setStatus(
  message,
  type = ""
) {

  statusElement.textContent =
    message;

  statusElement.className =
    type;

}


function generateGameCode() {

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    code +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return code;

}


function saveSession() {

  if (
    !currentGame ||
    !currentPlayer
  ) {

    return;

  }

  localStorage.setItem(
    "undercover_session",
    JSON.stringify({

      gameId:
        currentGame.id,

      playerId:
        currentPlayer.id

    })
  );

}


function clearSession() {

  localStorage.removeItem(
    "undercover_session"
  );

}


function difficultyLabel(
  value
) {

  if (value === "medium") {
    return "🔵 Moyen";
  }

  if (value === "hard") {
    return "🟠 Difficile";
  }

  if (value === "subtle") {
    return "🔴 Subtil";
  }

  return "🟢 Facile";

}


function updateConfigInfo() {

  if (!currentGame) {
    return;
  }

  configInfoElement.innerHTML =

    "👥 " +
    (currentGame.player_count || "?") +
    " joueurs<br>" +

    "🕵️ " +
    (currentGame.undercover_count || "?") +
    " Undercover<br>" +

    "🎯 " +
    difficultyLabel(
      currentGame.difficulty
    ) +

    "<br>" +

    "📝 " +
    (
      currentGame.topic
        ? escapeHTML(currentGame.topic)
        : "Thème libre"
    );

}


async function createGame() {

  const input =
    document.getElementById(
      "createName"
    );

  const name =
    input.value.trim();


  if (!name) {

    setStatus(
      "❌ Entre ton prénom.",
      "error"
    );

    return;

  }


  setStatus(
    "Création de la partie..."
  );


  try {

    const code =
      generateGameCode();


    const {
      data: game,
      error: gameError
    } =
      await supabaseClient
        .from("games")
        .insert({

          code: code,

          max_players: 10,

          undercover_count: 1,

          player_count: 3,

          topic: null,

          difficulty: "easy",

          status: "waiting",

          phase: "lobby",

          current_round: 1

        })
        .select()
        .single();


    if (gameError) {
      throw gameError;
    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .insert({

          game_id:
            game.id,

          name:
            name,

          is_host:
            true,

          connected:
            true

        })
        .select()
        .single();


    if (playerError) {
      throw playerError;
    }


    currentGame =
      game;

    currentPlayer =
      player;


    saveSession();

    showLobby();


  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Erreur : " +
      error.message,
      "error"
    );

  }

}


async function joinGame() {

  const code =
    document
      .getElementById("joinCode")
      .value
      .trim()
      .toUpperCase();

  const name =
    document
      .getElementById("joinName")
      .value
      .trim();


  if (
    !code ||
    !name
  ) {

    setStatus(
      "❌ Entre le code et ton prénom.",
      "error"
    );

    return;

  }


  setStatus(
    "Recherche de la partie..."
  );


  try {

    const {
      data: game,
      error
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq("code", code)
        .maybeSingle();


    if (error) {
      throw error;
    }


    if (!game) {

      setStatus(
        "❌ Partie introuvable.",
        "error"
      );

      return;

    }


    if (
      game.status !==
      "waiting"
    ) {

      setStatus(
        "❌ Cette partie a déjà commencé.",
        "error"
      );

      return;

    }


    const {
      count
    } =
      await supabaseClient
        .from("players")
        .select(
          "id",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "game_id",
          game.id
        );


    if (
      count >=
      (game.max_players || 10)
    ) {

      setStatus(
        "❌ La partie est complète.",
        "error"
      );

      return;

    }


    const {
      data: existing
    } =
      await supabaseClient
        .from("players")
        .select("id")
        .eq("game_id", game.id)
        .eq("name", name)
        .maybeSingle();


    if (existing) {

      setStatus(
        "❌ Ce prénom est déjà utilisé.",
        "error"
      );

      return;

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .insert({

          game_id:
            game.id,

          name:
            name,

          is_host:
            false,

          connected:
            true

        })
        .select()
        .single();


    if (playerError) {
      throw playerError;
    }


    currentGame =
      game;

    currentPlayer =
      player;


    saveSession();

    showLobby();


  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Erreur : " +
      error.message,
      "error"
    );

  }

}


function showLobby() {

  homeElement
    .classList
    .add("hidden");

  lobbyElement
    .classList
    .remove("hidden");


  gameCodeElement.textContent =
    currentGame.code;


  updateConfigInfo();


  if (
    currentPlayer &&
    currentPlayer.is_host
  ) {

    configButton
      .classList
      .remove("hidden");

    startButton
      .classList
      .remove("hidden");

  } else {

    configButton
      .classList
      .add("hidden");

    startButton
      .classList
      .add("hidden");

  }


  setStatus(
    "✅ Lobby chargé",
    "success"
  );


  loadPlayers();

  subscribeToGame();

  subscribeToPlayers();

  startGamePolling();

}


async function loadPlayers() {

  if (!currentGame) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .select(
        "id, name, is_host, connected"
      )
      .eq(
        "game_id",
        currentGame.id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Erreur joueurs :",
      error
    );

    return;

  }


  renderPlayers(data);

}


function renderPlayers(
  players
) {

  if (
    !players ||
    players.length === 0
  ) {

    playerListElement.textContent =
      "Aucun joueur.";

    return;

  }


  playerListElement.innerHTML =
    players
      .map(function(player) {

        return `
          <div class="player">
            ${player.connected ? "🟢" : "⚪"}
            ${escapeHTML(player.name)}
            ${player.is_host ? " 👑" : ""}
          </div>
        `;

      })
      .join("");

}


function escapeHTML(
  value
) {

  return String(value)
    .replace(
      /[&<>"']/g,
      function(char) {

        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char];

      }
    );

}


configButton.addEventListener(
  "click",
  function() {

    if (
      !currentGame ||
      !currentPlayer ||
      !currentPlayer.is_host
    ) {

      return;

    }


    window.location.href =
      "config.html?game=" +
      encodeURIComponent(
        currentGame.id
      ) +
      "&player=" +
      encodeURIComponent(
        currentPlayer.id
      );

  }
);


startButton.addEventListener(
  "click",
  startGame
);


async function startGame() {

  if (
    !currentGame ||
    !currentPlayer ||
    !currentPlayer.is_host
  ) {

    return;

  }


  startButton.disabled =
    true;

  startButton.textContent =
    "🎮 Lancement...";


  setStatus(
    "🎮 Préparation des rôles..."
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "start_undercover_game",
          {
            p_game_id:
              currentGame.id
          }
        );


    if (error) {
      throw error;
    }


    console.log(
      "Partie créée :",
      data
    );


    currentGame.status =
      "playing";

    currentGame.phase =
      "reveal";


    saveSession();

    goToGame();


  } catch (error) {

    console.error(
      "Erreur lancement :",
      error
    );


    setStatus(
      "❌ Erreur au lancement : " +
      error.message,
      "error"
    );


    startButton.disabled =
      false;

    startButton.textContent =
      "🎮 Lancer la partie";

  }

}


function goToGame() {

  if (
    redirecting ||
    !currentGame ||
    !currentPlayer
  ) {

    return;

  }


  redirecting =
    true;


  stopGamePolling();


  window.location.href =
    "game.html?game=" +
    encodeURIComponent(
      currentGame.id
    ) +
    "&player=" +
    encodeURIComponent(
      currentPlayer.id
    );

}


function subscribeToGame() {

  if (!currentGame) {
    return;
  }


  if (realtimeChannel) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "lobby-game-" +
        currentGame.id
      )
      .on(
        "postgres_changes",
        {

          event:
            "UPDATE",

          schema:
            "public",

          table:
            "games",

          filter:
            "id=eq." +
            currentGame.id

        },
        function(payload) {

          currentGame =
            payload.new;


          updateConfigInfo();


          if (
            payload.new.status ===
            "playing"
          ) {

            saveSession();

            goToGame();

          }

        }
      )
      .subscribe();


}


function subscribeToPlayers() {

  if (!currentGame) {
    return;
  }


  if (playersChannel) {

    supabaseClient
      .removeChannel(
        playersChannel
      );

  }


  playersChannel =
    supabaseClient
      .channel(
        "lobby-players-" +
        currentGame.id
      )
      .on(
        "postgres_changes",
        {

          event:
            "*",

          schema:
            "public",

          table:
            "players",

          filter:
            "game_id=eq." +
            currentGame.id

        },
        function() {

          loadPlayers();

        }
      )
      .subscribe();

}


function startGamePolling() {

  stopGamePolling();


  gamePollTimer =
    setInterval(
      checkGameStatus,
      2000
    );

}


function stopGamePolling() {

  if (gamePollTimer) {

    clearInterval(
      gamePollTimer
    );

    gamePollTimer =
      null;

  }

}


async function checkGameStatus() {

  if (
    !currentGame ||
    redirecting
  ) {

    return;

  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "id",
          currentGame.id
        )
        .maybeSingle();


    if (
      error ||
      !data
    ) {

      return;

    }


    currentGame =
      data;


    updateConfigInfo();


    if (
      currentGame.status ===
      "playing"
    ) {

      saveSession();

      goToGame();

    }

  } catch (error) {

    console.error(
      "Polling :",
      error
    );

  }

}


async function restoreSessionFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const gameId =
    params.get("game");

  const playerId =
    params.get("player");


  if (!gameId) {
    return false;
  }


  setStatus(
    "🔄 Récupération de la partie..."
  );


  try {

    const {
      data: game,
      error: gameError
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "id",
          gameId
        )
        .maybeSingle();


    if (gameError) {
      throw gameError;
    }


    if (!game) {

      throw new Error(
        "Partie introuvable."
      );

    }


    let finalPlayerId =
      playerId;


    if (!finalPlayerId) {

      const saved =
        localStorage.getItem(
          "undercover_session"
        );


      if (saved) {

        try {

          const session =
            JSON.parse(saved);


          if (
            session.gameId ===
            gameId
          ) {

            finalPlayerId =
              session.playerId;

          }

        } catch (e) {}

      }

    }


    if (!finalPlayerId) {

      setStatus(
        "⚠️ Partie trouvée. Rejoins-la avec son code.",
        "error"
      );

      return false;

    }


    const {
      data: player,
      error: playerError
    } =
      await supabaseClient
        .from("players")
        .select("*")
        .eq(
          "id",
          finalPlayerId
        )
        .eq(
          "game_id",
          gameId
        )
        .maybeSingle();


    if (playerError) {
      throw playerError;
    }


    if (!player) {

      throw new Error(
        "Joueur introuvable dans cette partie."
      );

    }


    currentGame =
      game;

    currentPlayer =
      player;


    saveSession();


    if (
      currentGame.status ===
      "playing"
    ) {

      goToGame();

      return true;

    }


    showLobby();

    return true;


  } catch (error) {

    console.error(
      "Restauration :",
      error
    );


    setStatus(
      "❌ Impossible de récupérer la partie : " +
      error.message,
      "error"
    );


    return false;

  }

}


async function leaveGame() {

  stopGamePolling();


  if (realtimeChannel) {

    await supabaseClient
      .removeChannel(
        realtimeChannel
      );

    realtimeChannel =
      null;

  }


  if (playersChannel) {

    await supabaseClient
      .removeChannel(
        playersChannel
      );

    playersChannel =
      null;

  }


  try {

    if (currentPlayer) {

      await supabaseClient
        .from("players")
        .delete()
        .eq(
          "id",
          currentPlayer.id
        );

    }

  } catch (error) {

    console.error(error);

  }


  clearSession();


  currentGame =
    null;

  currentPlayer =
    null;

  redirecting =
    false;


  lobbyElement
    .classList
    .add("hidden");

  homeElement
    .classList
    .remove("hidden");


  configButton
    .classList
    .add("hidden");

  startButton
    .classList
    .add("hidden");


  setStatus(
    "Prêt à jouer."
  );

}


leaveButton.addEventListener(
  "click",
  leaveGame
);


document
  .getElementById("createButton")
  .addEventListener(
    "click",
    createGame
  );


document
  .getElementById("joinButton")
  .addEventListener(
    "click",
    joinGame
  );


async function testSupabase() {

  try {

    const {
      error
    } =
      await supabaseClient
        .from("games")
        .select("id")
        .limit(1);


    if (error) {

      setStatus(
        "❌ Supabase : " +
        error.message,
        "error"
      );

      return;

    }


    const restored =
      await restoreSessionFromUrl();


    if (!restored) {

      setStatus(
        "✅ Supabase connecté",
        "success"
      );

    }

  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Supabase : " +
      error.message,
      "error"
    );

  }

}


window.addEventListener(
  "beforeunload",
  function() {

    stopGamePolling();

    if (realtimeChannel) {

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }

    if (playersChannel) {

      supabaseClient
        .removeChannel(
          playersChannel
        );

    }

  }
);


testSupabase();

</script>

</body>
</html>
