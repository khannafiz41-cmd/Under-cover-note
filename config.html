<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Undercover Notes - Configuration</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c18;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #111a2e;
      border: 1px solid #293653;
      border-radius: 18px;
      padding: 20px;
      margin-top: 18px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #34415f;
      background: #090f20;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      background: #18233a;
    }

    #status {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: #18233a;
      margin-top: 15px;
      line-height: 1.5;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    #preview {
      margin-top: 20px;
      padding: 15px;
      background: #18233a;
      border-radius: 12px;
      line-height: 1.7;
    }

    .difficulty-info {
      margin-top: 10px;
      color: #cbd5e1;
      line-height: 1.5;
      font-size: 14px;
    }

  </style>

</head>

<body>

<main>

  <h1>🕵️ Undercover Notes</h1>

  <div id="status">
    Chargement...
  </div>


  <div class="card">

    <h2>⚙️ Configuration de la partie</h2>


    <label for="playerCount">
      👥 Nombre de joueurs
    </label>

    <select id="playerCount">

      <option value="3">3 joueurs</option>
      <option value="4">4 joueurs</option>
      <option value="5">5 joueurs</option>
      <option value="6">6 joueurs</option>
      <option value="7">7 joueurs</option>
      <option value="8">8 joueurs</option>
      <option value="9">9 joueurs</option>
      <option value="10">10 joueurs</option>

    </select>


    <label for="undercoverCount">
      🕵️ Nombre d'Undercover
    </label>

    <select id="undercoverCount">

      <option value="1">1 Undercover</option>
      <option value="2">2 Undercover</option>
      <option value="3">3 Undercover</option>

    </select>


    <label for="difficulty">
      🎯 Niveau de difficulté
    </label>

    <select id="difficulty">

      <option value="easy">
        🟢 Facile
      </option>

      <option value="medium">
        🔵 Moyen
      </option>

      <option value="hard">
        🟠 Difficile
      </option>

      <option value="subtle">
        🔴 Subtil
      </option>

    </select>


    <div
      id="difficultyInfo"
      class="difficulty-info"
    >
      Mots assez différents. Idéal pour commencer.
    </div>


    <label for="topic">
      📝 Thème
    </label>

    <input
      id="topic"
      type="text"
      maxlength="50"
      placeholder="Exemple : nourriture"
    >


    <div id="preview">
      👥 3 joueurs<br>
      🕵️ 1 Undercover<br>
      🧑‍🌾 2 joueurs classiques<br>
      🎯 Difficulté : 🟢 Facile
    </div>


    <button id="saveButton">
      💾 Enregistrer
    </button>


    <button
      id="backButton"
      class="back"
    >
      ← Retour au lobby
    </button>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://sarszeuyxrozsljhgyos.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_K_iSNYX03boGTMYWG07hfQ_TjG0FaaA";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const params =
  new URLSearchParams(
    window.location.search
  );


const gameId =
  params.get("game");


let playerId =
  params.get("player");


const statusElement =
  document.getElementById("status");

const playerCountElement =
  document.getElementById("playerCount");

const undercoverCountElement =
  document.getElementById("undercoverCount");

const difficultyElement =
  document.getElementById("difficulty");

const difficultyInfoElement =
  document.getElementById("difficultyInfo");

const topicElement =
  document.getElementById("topic");

const previewElement =
  document.getElementById("preview");

const saveButton =
  document.getElementById("saveButton");

const backButton =
  document.getElementById("backButton");


let gameStatus =
  "waiting";


function setStatus(
  message,
  type = ""
) {

  statusElement.textContent =
    message;

  statusElement.className =
    type;

}


function getDifficultyLabel(
  value
) {

  if (value === "medium") {
    return "🔵 Moyen";
  }

  if (value === "hard") {
    return "🟠 Difficile";
  }

  if (value === "subtle") {
    return "🔴 Subtil";
  }

  return "🟢 Facile";

}


function updateDifficultyInfo() {

  const difficulty =
    difficultyElement.value;


  if (difficulty === "medium") {

    difficultyInfoElement.textContent =
      "Les mots sont assez proches. Il faut déjà bien réfléchir aux indices.";

  } else if (difficulty === "hard") {

    difficultyInfoElement.textContent =
      "Les mots sont très proches. Les indices doivent être précis.";

  } else if (difficulty === "subtle") {

    difficultyInfoElement.textContent =
      "Les mots sont extrêmement proches. Réservé aux joueurs expérimentés.";

  } else {

    difficultyInfoElement.textContent =
      "Mots assez différents. Idéal pour commencer.";

  }

}


function updatePreview() {

  const players =
    Number(
      playerCountElement.value
    );


  let undercover =
    Number(
      undercoverCountElement.value
    );


  if (undercover >= players) {

    undercover =
      players - 1;

    undercoverCountElement.value =
      String(undercover);

  }


  const villagers =
    players -
    undercover;


  previewElement.innerHTML =

    "👥 " +
    players +
    " joueurs<br>" +

    "🕵️ " +
    undercover +
    " Undercover<br>" +

    "🧑‍🌾 " +
    villagers +
    " joueur" +
    (
      villagers > 1
        ? "s"
        : ""
    ) +
    " classique<br>" +

    "🎯 Difficulté : " +
    getDifficultyLabel(
      difficultyElement.value
    );

}


playerCountElement.addEventListener(
  "change",
  updatePreview
);


undercoverCountElement.addEventListener(
  "change",
  updatePreview
);


difficultyElement.addEventListener(
  "change",
  function() {

    updateDifficultyInfo();

    updatePreview();

  }
);


async function loadGame() {

  if (!gameId) {

    setStatus(
      "❌ Aucune partie sélectionnée.",
      "error"
    );

    saveButton.disabled =
      true;

    return;

  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq(
          "id",
          gameId
        )
        .maybeSingle();


    if (error) {
      throw error;
    }


    if (!data) {

      setStatus(
        "❌ Partie introuvable.",
        "error"
      );

      saveButton.disabled =
        true;

      return;

    }


    gameStatus =
      data.status;


    if (
      data.status !==
      "waiting"
    ) {

      setStatus(
        "⚠️ Cette partie est déjà lancée.",
        "error"
      );

      saveButton.disabled =
        true;

      return;

    }


    if (data.player_count) {

      playerCountElement.value =
        String(
          data.player_count
        );

    }


    if (data.undercover_count) {

      undercoverCountElement.value =
        String(
          data.undercover_count
        );

    }


    if (data.difficulty) {

      difficultyElement.value =
        data.difficulty;

    }


    if (data.topic) {

      topicElement.value =
        data.topic;

    }


    updateDifficultyInfo();

    updatePreview();


    setStatus(
      "✅ Partie chargée.",
      "success"
    );


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Erreur Supabase : " +
      error.message,
      "error"
    );

  }

}


async function saveConfiguration() {

  if (!gameId) {

    setStatus(
      "❌ Aucune partie sélectionnée.",
      "error"
    );

    return;

  }


  if (
    gameStatus !==
    "waiting"
  ) {

    setStatus(
      "❌ La partie est déjà lancée.",
      "error"
    );

    return;

  }


  const players =
    Number(
      playerCountElement.value
    );


  const undercover =
    Number(
      undercoverCountElement.value
    );


  const difficulty =
    difficultyElement.value;


  const topic =
    topicElement.value.trim();


  if (
    players < 3 ||
    players > 10
  ) {

    setStatus(
      "❌ Le nombre de joueurs doit être entre 3 et 10.",
      "error"
    );

    return;

  }


  if (
    undercover < 1 ||
    undercover >= players
  ) {

    setStatus(
      "❌ Nombre d'Undercover invalide.",
      "error"
    );

    return;

  }


  saveButton.disabled =
    true;


  saveButton.textContent =
    "💾 Enregistrement...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("games")
        .update({

          player_count:
            players,

          undercover_count:
            undercover,

          difficulty:
            difficulty,

          topic:
            topic || null,

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          gameId
        )
        .select()
        .single();


    if (error) {
      throw error;
    }


    if (!data) {

      throw new Error(
        "La partie n'a pas été trouvée."
      );

    }


    setStatus(
      "✅ Configuration enregistrée !",
      "success"
    );


    saveButton.textContent =
      "✅ Enregistré";


    setTimeout(
      function() {

        saveButton.textContent =
          "💾 Enregistrer";

      },
      1500
    );


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ Impossible d'enregistrer : " +
      error.message,
      "error"
    );


    saveButton.textContent =
      "💾 Enregistrer";

  }


  saveButton.disabled =
    false;

}


saveButton.addEventListener(
  "click",
  saveConfiguration
);


backButton.addEventListener(
  "click",
  function() {

    let finalPlayerId =
      playerId;


    if (!finalPlayerId) {

      try {

        const saved =
          localStorage.getItem(
            "undercover_session"
          );


        if (saved) {

          const session =
            JSON.parse(saved);


          if (
            session.gameId ===
            gameId
          ) {

            finalPlayerId =
              session.playerId;

          }

        }

      } catch (error) {}

    }


    if (!gameId) {

      window.location.href =
        "index-multiplayer.html";

      return;

    }


    let url =
      "index-multiplayer.html?game=" +
      encodeURIComponent(
        gameId
      );


    if (finalPlayerId) {

      url +=
        "&player=" +
        encodeURIComponent(
          finalPlayerId
        );

    }


    window.location.replace(
      url
    );

  }
);


updateDifficultyInfo();

updatePreview();

loadGame();

</script>

</body>
</html>
