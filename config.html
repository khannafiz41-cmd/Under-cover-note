<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Undercover Notes - Configuration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c18;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: #111a2e;
      border: 1px solid #293653;
      border-radius: 18px;
      padding: 20px;
      margin: 15px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #34415f;
      background: #090f20;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #18233a;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: #18233a;
      margin-bottom: 15px;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .preview {
      margin-top: 20px;
      padding: 15px;
      background: #18233a;
      border-radius: 12px;
      line-height: 1.7;
    }

    .note {
      font-size: 13px;
      opacity: 0.75;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<main>

  <h1>🕵️ Undercover Notes</h1>

  <div id="status" class="status">
    Connexion à Supabase...
  </div>


  <div class="card">

    <h2>⚙️ Configuration</h2>

    <label for="playerCount">
      👥 Nombre de joueurs
    </label>

    <select id="playerCount">

      <option value="3">
        3 joueurs
      </option>

      <option value="4">
        4 joueurs
      </option>

      <option value="5">
        5 joueurs
      </option>

      <option value="6">
        6 joueurs
      </option>

      <option value="7">
        7 joueurs
      </option>

      <option value="8">
        8 joueurs
      </option>

      <option value="9">
        9 joueurs
      </option>

      <option value="10">
        10 joueurs
      </option>

    </select>


    <label for="undercoverCount">
      🕵️ Nombre d'Undercover
    </label>

    <select id="undercoverCount">

      <option value="1">
        1 Undercover
      </option>

      <option value="2">
        2 Undercover
      </option>

      <option value="3">
        3 Undercover
      </option>

    </select>


    <label for="topic">
      📝 Thème de la partie
    </label>

    <input
      id="topic"
      type="text"
      maxlength="50"
      placeholder="Exemple : nourriture"
    >

    <div id="preview" class="preview">
      👥 3 joueurs<br>
      🕵️ 1 Undercover<br>
      🧑‍🌾 2 joueurs classiques
    </div>


    <button id="saveButton">
      💾 Enregistrer la configuration
    </button>


    <button
      id="backButton"
      class="secondary"
    >
      ← Retour au lobby
    </button>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* ==========================================
     SUPABASE
  ========================================== */

  const SUPABASE_URL =
    "TON_PROJECT_URL";

  const SUPABASE_KEY =
    "TA_NOUVELLE_CLE_PUBLISHABLE";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     ÉLÉMENTS
  ========================================== */

  const statusElement =
    document.getElementById("status");

  const playerCountElement =
    document.getElementById("playerCount");

  const undercoverCountElement =
    document.getElementById("undercoverCount");

  const topicElement =
    document.getElementById("topic");

  const previewElement =
    document.getElementById("preview");


  /* ==========================================
     STATUT
  ========================================== */

  function setStatus(
    message,
    type = ""
  ) {

    statusElement.textContent =
      message;

    statusElement.className =
      "status " + type;

  }


  /* ==========================================
     APERÇU
  ========================================== */

  function updatePreview() {

    const players =
      Number(
        playerCountElement.value
      );

    let undercover =
      Number(
        undercoverCountElement.value
      );


    /*
      On empêche d'avoir autant
      d'Undercover que de joueurs.
    */

    if (
      undercover >= players
    ) {

      undercover =
        players - 1;

      undercoverCountElement.value =
        undercover;

    }


    const villagers =
      players - undercover;


    previewElement.innerHTML =

      "👥 " +
      players +
      " joueurs<br>" +

      "🕵️ " +
      undercover +
      (
        undercover > 1
          ? " Undercover"
          : " Undercover"
      ) +
      "<br>" +

      "🧑‍🌾 " +
      villagers +
      " joueur" +
      (
        villagers > 1
          ? "s"
          : ""
      ) +
      " classique";

  }


  playerCountElement
    .addEventListener(
      "change",
      updatePreview
    );


  undercoverCountElement
    .addEventListener(
      "change",
      updatePreview
    );


  /* ==========================================
     TEST SUPABASE
  ========================================== */

  async function testSupabase() {

    try {

      const {
        error
      } =
        await supabaseClient
          .from("games")
          .select("id")
          .limit(1);


      if (error) {

        console.error(error);

        setStatus(
          "Erreur Supabase : " +
          error.message,
          "error"
        );

        return false;

      }


      setStatus(
        "Supabase connecté ✅",
        "success"
      );

      return true;

    } catch (error) {

      console.error(error);

      setStatus(
        "Impossible de contacter Supabase.",
        "error"
      );

      return false;

    }

  }


  /* ==========================================
     ENREGISTRER
  ========================================== */

  document
    .getElementById("saveButton")
    .addEventListener(
      "click",
      saveConfiguration
    );


  async function saveConfiguration() {

    const players =
      Number(
        playerCountElement.value
      );

    const undercover =
      Number(
        undercoverCountElement.value
      );

    const topic =
      topicElement
        .value
        .trim();


    if (!topic) {

      setStatus(
        "Écris un thème.",
        "error"
      );

      topicElement.focus();

      return;

    }


    if (
      undercover >= players
    ) {

      setStatus(
        "Il faut au moins un joueur classique.",
        "error"
      );

      return;

    }


    /*
      Pour cette étape,
      on sauvegarde simplement
      la configuration dans le navigateur.
    */

    const configuration = {

      playerCount:
        players,

      undercoverCount:
        undercover,

      topic:
        topic

    };


    localStorage.setItem(
      "undercover_configuration",
      JSON.stringify(
        configuration
      )
    );


    setStatus(
      "Configuration enregistrée ✅",
      "success"
    );


    setTimeout(
      function() {

        window.location.href =
          "multiplayer-test.html";

      },
      700
    );

  }


  /* ==========================================
     RETOUR
  ========================================== */

  document
    .getElementById("backButton")
    .addEventListener(
      "click",
      function() {

        window.location.href =
          "multiplayer-test.html";

      }
    );


  /* ==========================================
     INITIALISATION
  ========================================== */

  updatePreview();

  testSupabase();

</script>

</body>
</html>
