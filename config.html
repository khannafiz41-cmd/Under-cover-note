<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Undercover Notes - Configuration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c18;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #111a2e;
      border: 1px solid #293653;
      border-radius: 18px;
      padding: 20px;
      margin-top: 18px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #34415f;
      background: #090f20;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      background: #18233a;
    }

    #status {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: #18233a;
      margin-top: 15px;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    #preview {
      margin-top: 20px;
      padding: 15px;
      background: #18233a;
      border-radius: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<main>

  <h1>🕵️ Undercover Notes</h1>

  <div id="status">
    Connexion à Supabase...
  </div>

  <div class="card">

    <h2>⚙️ Configuration de la partie</h2>

    <label for="playerCount">
      👥 Nombre de joueurs
    </label>

    <select id="playerCount">
      <option value="3">3 joueurs</option>
      <option value="4">4 joueurs</option>
      <option value="5">5 joueurs</option>
      <option value="6">6 joueurs</option>
      <option value="7">7 joueurs</option>
      <option value="8">8 joueurs</option>
      <option value="9">9 joueurs</option>
      <option value="10">10 joueurs</option>
    </select>

    <label for="undercoverCount">
      🕵️ Nombre d'Undercover
    </label>

    <select id="undercoverCount">
      <option value="1">1 Undercover</option>
      <option value="2">2 Undercover</option>
      <option value="3">3 Undercover</option>
    </select>

    <label for="topic">
      📝 Thème
    </label>

    <input
      id="topic"
      type="text"
      maxlength="50"
      placeholder="Exemple : nourriture"
    >

    <div id="preview">
      👥 3 joueurs<br>
      🕵️ 1 Undercover<br>
      🧑‍🌾 2 joueurs classiques
    </div>

    <button id="saveButton">
      💾 Enregistrer
    </button>

    <button
      id="backButton"
      class="back"
    >
      ← Retour au lobby
    </button>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* ============================
     SUPABASE
  ============================ */

  const SUPABASE_URL =
    "TON_PROJECT_URL";

  const SUPABASE_KEY =
    "TA_CLE_PUBLISHABLE";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ============================
     ÉLÉMENTS
  ============================ */

  const status =
    document.getElementById("status");

  const playerCount =
    document.getElementById("playerCount");

  const undercoverCount =
    document.getElementById("undercoverCount");

  const topic =
    document.getElementById("topic");

  const preview =
    document.getElementById("preview");


  /* ============================
     STATUT
  ============================ */

  function setStatus(
    text,
    type = ""
  ) {

    status.textContent = text;
    status.className = type;

  }


  /* ============================
     APERÇU
  ============================ */

  function updatePreview() {

    const players =
      Number(playerCount.value);

    let undercover =
      Number(undercoverCount.value);


    if (undercover >= players) {

      undercover =
        players - 1;

      undercoverCount.value =
        undercover;

    }


    const villagers =
      players - undercover;


    preview.innerHTML =
      "👥 " +
      players +
      " joueurs<br>" +

      "🕵️ " +
      undercover +
      " Undercover<br>" +

      "🧑‍🌾 " +
      villagers +
      " joueur" +
      (
        villagers > 1
          ? "s"
          : ""
      ) +
      " classique";

  }


  playerCount.addEventListener(
    "change",
    updatePreview
  );


  undercoverCount.addEventListener(
    "change",
    updatePreview
  );


  /* ============================
     TEST SUPABASE
  ============================ */

  async function testSupabase() {

    try {

      const {
        error
      } =
        await supabaseClient
          .from("games")
          .select("id")
          .limit(1);


      if (error) {

        console.error(error);

        setStatus(
          "Erreur Supabase : " +
          error.message,
          "error"
        );

        return;

      }


      setStatus(
        "Supabase connecté ✅",
        "success"
      );


    } catch (error) {

      console.error(error);

      setStatus(
        "Erreur de connexion.",
        "error"
      );

    }

  }


  /* ============================
     ENREGISTRER
  ============================ */

  document
    .
