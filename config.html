<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Undercover Notes - Configuration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c18;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: #111a2e;
      border: 1px solid #293653;
      border-radius: 18px;
      padding: 20px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #34415f;
      background: #090f20;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .back {
      background: #18233a;
    }

    #status {
      text-align: center;
      padding: 13px;
      border-radius: 12px;
      background: #18233a;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    #preview {
      margin-top: 20px;
      padding: 15px;
      background: #18233a;
      border-radius: 12px;
      line-height: 1.8;
    }

    .info {
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      background: #0d1426;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<main>

  <h1>🕵️ Undercover Notes</h1>

  <div id="status">
    Connexion à Supabase...
  </div>

  <div class="card">

    <h2>⚙️ Configuration</h2>

    <label for="playerCount">
      👥 Nombre de joueurs
    </label>

    <select id="playerCount">
      <option value="3">3 joueurs</option>
      <option value="4">4 joueurs</option>
      <option value="5">5 joueurs</option>
      <option value="6">6 joueurs</option>
      <option value="7">7 joueurs</option>
      <option value="8">8 joueurs</option>
      <option value="9">9 joueurs</option>
      <option value="10">10 joueurs</option>
    </select>


    <label for="undercoverCount">
      🕵️ Nombre d'Undercover
    </label>

    <select id="undercoverCount">
      <option value="1">1 Undercover</option>
      <option value="2">2 Undercover</option>
      <option value="3">3 Undercover</option>
    </select>


    <label for="topic">
      📝 Thème
    </label>

    <input
      id="topic"
      type="text"
      maxlength="50"
      placeholder="Exemple : nourriture"
    >


    <div id="preview">
      👥 3 joueurs<br>
      🕵️ 1 Undercover<br>
      🧑‍🌾 2 joueurs classiques
    </div>


    <button id="saveButton">
      💾 Enregistrer
    </button>


    <button id="backButton" class="back">
      ← Retour au lobby
    </button>


    <div class="info">
      La configuration est enregistrée sur cet appareil.
    </div>

  </div>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  /* ==================================================
     SUPABASE
     ================================================== */

  /*
    ⚠️ GARDE TES VRAIES VALEURS ICI.
    Utilise exactement les mêmes que dans
    ton supabase-test.html.
  */

  const SUPABASE_URL =
    "https://sarszeuyxrozsljhgyos.supabase.co";
";

  const SUPABASE_KEY =
    "sb_publishable_K_iSNYX03boGTMYWG07hfQ_TjG0FaaA";


  /* ==================================================
     CLIENT SUPABASE
     ================================================== */

  let supabaseClient = null;


  /* ==================================================
     ÉLÉMENTS
     ================================================== */

  const statusElement =
    document.getElementById("status");

  const playerCountElement =
    document.getElementById("playerCount");

  const undercoverCountElement =
    document.getElementById("undercoverCount");

  const topicElement =
    document.getElementById("topic");

  const previewElement =
    document.getElementById("preview");


  /* ==================================================
     MESSAGE
     ================================================== */

  function showStatus(message, type) {

    statusElement.textContent = message;

    statusElement.className = "";

    if (type) {
      statusElement.classList.add(type);
    }

  }


  /* ==================================================
     CRÉER LE CLIENT SUPABASE
     ================================================== */

  function createSupabaseClient() {

    if (!window.supabase) {

      showStatus(
        "❌ Supabase ne s'est pas chargé.",
        "error"
      );

      return false;
    }


    if (
      !SUPABASE_URL ||
      SUPABASE_URL === "TON_URL_SUPABASE"
    ) {

      showStatus(
        "❌ URL Supabase manquante.",
        "error"
      );

      return false;
    }


    if (
      !SUPABASE_KEY ||
      SUPABASE_KEY === "TA_CLE_PUBLISHABLE"
    ) {

      showStatus(
        "❌ Clé Supabase manquante.",
        "error"
      );

      return false;
    }


    try {

      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

      return true;

    } catch (error) {

      console.error(error);

      showStatus(
        "❌ Impossible de créer la connexion Supabase.",
        "error"
      );

      return false;
    }

  }


  /* ==================================================
     TEST SUPABASE
     ================================================== */

  async function testSupabase() {

    if (!createSupabaseClient()) {
      return;
    }


    showStatus(
      "Connexion à Supabase..."
    );


    try {

      const result =
        await supabaseClient
          .from("games")
          .select("id")
          .limit(1);


      if (result.error) {

        console.error(
          "Erreur Supabase :",
          result.error
        );

        showStatus(
          "❌ Supabase : " +
          result.error.message,
          "error"
        );

        return;
      }


      showStatus(
        "✅ SUPABASE FONCTIONNE",
        "success"
      );


    } catch (error) {

      console.error(
        "Erreur :",
        error
      );

      showStatus(
        "❌ Erreur : " +
        error.message,
        "error"
      );

    }

  }


  /* ==================================================
     APERÇU
     ================================================== */

  function updatePreview() {

    const players =
      Number(
        playerCountElement.value
      );


    let undercover =
      Number(
        undercoverCountElement.value
      );


    /*
      Il faut toujours garder
      au moins un joueur normal.
    */

    if (undercover >= players) {

      undercover =
        players - 1;

      undercoverCountElement.value =
        undercover;
    }


    const normalPlayers =
      players - undercover;


    previewElement.innerHTML =
      "👥 " +
      players +
      " joueurs<br>" +

      "🕵️ " +
      undercover +
      (
        undercover > 1
          ? " Undercover"
          : " Undercover"
      ) +
      "<br>" +

      "🧑‍🌾 " +
      normalPlayers +
      (
        normalPlayers > 1
          ? " joueurs classiques"
          : " joueur classique"
      );

  }


  /* ==================================================
     CHANGEMENT DES MENUS
     ================================================== */

  playerCountElement.addEventListener(
    "change",
    updatePreview
  );


  undercoverCountElement.addEventListener(
    "change",
    updatePreview
  );


  /* ==================================================
     ENREGISTRER LA CONFIGURATION
     ================================================== */

  document
    .getElementById("saveButton")
    .addEventListener(
      "click",
      function() {

        const players =
          Number(
            playerCountElement.value
          );


        const undercover =
          Number(
            undercoverCountElement.value
          );


        const topic =
          topicElement.value.trim();


        if (!topic) {

          showStatus(
            "❌ Écris un thème.",
            "error"
          );

          topicElement.focus();

          return;
        }


        if (undercover >= players) {

          showStatus(
            "❌ Il faut au moins un joueur classique.",
            "error"
          );

          return;
        }


        const configuration = {

          playerCount:
            players,

          undercoverCount:
            undercover,

          topic:
            topic,

          savedAt:
            Date.now()

        };


        localStorage.setItem(
          "undercover_configuration",
          JSON.stringify(
            configuration
          )
        );


        showStatus(
          "✅ Configuration enregistrée !",
          "success"
        );


        console.log(
          "Configuration enregistrée :",
          configuration
        );

      }
    );


  /* ==================================================
     RETOUR AU MULTIJOUEUR
     ================================================== */

  document
    .getElementById("backButton")
    .addEventListener(
      "click",
      function() {

        /*
          On revient simplement à la page
          multijoueur qui fonctionne déjà.
        */

        window.location.href =
          "index-multiplayer.html";

      }
    );


  /* ==================================================
     DÉMARRAGE
     ================================================== */

  updatePreview();

  testSupabase();

</script>

</body>
</html>
