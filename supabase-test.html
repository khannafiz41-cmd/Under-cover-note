<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Supabase</title>
</head>

<body>

  <h1>Test Supabase</h1>

  <p id="result">Test en cours...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://sarszeuyxrozsljhgyos.supabase.co";
    const SUPABASE_KEY = "sb_publishable_K_iSNYX03boGTMYWG07hfQ_TjG0FaaA";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function test() {

      const result = document.getElementById("result");

      const { data, error } = await client
        .from("games")
        .select("id")
        .limit(1);

      if (error) {
        result.textContent =
          "❌ ERREUR : " + error.message;

        console.error(error);
        return;
      }

      result.textContent =
        "✅ SUPABASE FONCTIONNE !";

      console.log(data);
    }

    test();
  </script>

</body>
</html>
