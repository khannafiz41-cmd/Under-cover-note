<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Undercover Notes - Partie</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080c18;
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: #111a2e;
      border: 1px solid #293653;
      border-radius: 18px;
      padding: 25px;
      margin: 15px 0;
      text-align: center;
    }

    #status {
      padding: 12px;
      border-radius: 12px;
      background: #18233a;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .code {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 7px;
      margin: 20px 0;
    }

    .info {
      color: #cbd5e1;
      line-height: 1.6;
    }

    .difficulty {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      border-radius: 12px;
      background: #18233a;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #18233a;
      border: 1px solid #293653;
    }

  </style>

</head>

<body>

<main>

  <h1>🕵️ Undercover Notes</h1>

  <div id="status">
    Chargement de la partie...
  </div>

  <div class="card">

    <h2>🎮 La partie commence !</h2>

    <div
      id="gameCode"
      class="code"
    >
      ----
    </div>

    <p
      id="playerName"
      class="info"
    >
      Chargement...
    </p>

    <p
      id="gameInfo"
      class="info"
    >
      Chargement de la configuration...
    </p>

    <div
      id="difficulty"
      class="difficulty"
    >
      🎯 Difficulté : ...
    </div>

  </div>

  <button
    id="backButton"
    class="secondary"
  >
    ← Retour au lobby
  </button>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://sarszeuyxrozsljhgyos.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_K_iSNYX03boGTMYWG07hfQ_TjG0FaaA";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const params =
  new URLSearchParams(
    window.location.search
  );

const gameId =
  params.get("game");

const playerId =
  params.get("player");


const statusElement =
  document.getElementById("status");

const gameCodeElement =
  document.getElementById("gameCode");

const playerNameElement =
  document.getElementById("playerName");

const gameInfoElement =
  document.getElementById("gameInfo");

const difficultyElement =
  document.getElementById("difficulty");


let realtimeChannel = null;
let pollTimer = null;


function setStatus(message, type = "") {

  statusElement.textContent =
    message;

  statusElement.className =
    type;

}


function getDifficultyLabel(value) {

  if (value === "medium") {
    return "🔵 Moyen";
  }

  if (value === "hard") {
    return "🟠 Difficile";
  }

  if (value === "subtle") {
    return "🔴 Subtil";
  }

  return "🟢 Facile";

}


async function loadGame() {

  if (!gameId) {

    setStatus(
      "❌ Aucune partie sélectionnée.",
      "error"
    );

    return;

  }

  try {

    const {
      data: game,
      error
    } =
      await supabaseClient
        .from("games")
        .select("*")
        .eq("id", gameId)
        .maybeSingle();

    if (error) {
      throw error;
    }

    if (!game) {

      setStatus(
        "❌ Partie introuvable.",
        "error"
      );

      return;

    }

    gameCodeElement.textContent =
      game.code;

    if (playerId) {

      const {
        data: player
      } =
        await supabaseClient
          .from("players")
          .select("*")
          .eq("id", playerId)
          .eq("game_id", gameId)
          .maybeSingle();

      if (player) {

        playerNameElement.textContent =
          "👤 Joueur : " +
          player.name;

      }

    }

    gameInfoElement.innerHTML =
      "👥 " +
      (game.player_count || "?") +
      " joueurs<br>" +

      "🕵️ " +
      (game.undercover_count || "?") +
      " Undercover<br>" +

      "📝 Thème : " +
      (
        game.topic
          ? escapeHTML(game.topic)
          : "Aucun thème"
      );

    difficultyElement.textContent =
      "🎯 Difficulté : " +
      getDifficultyLabel(
        game.difficulty
      );

    if (game.status === "playing") {

      setStatus(
        "✅ Partie en cours",
        "success"
      );

    } else {

      setStatus(
        "⏳ En attente du lancement..."
      );

    }

    subscribeToGame();
    startPolling();

  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Erreur : " +
      error.message,
      "error"
    );

  }

}


function escapeHTML(value) {

  return String(value)
    .replace(
      /[&<>"']/g,
      function(char) {

        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char];

      }
    );

}


function subscribeToGame() {

  if (realtimeChannel) {

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }

  realtimeChannel =
    supabaseClient
      .channel(
        "game-page-" +
        gameId
      )
      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "games",
          filter:
            "id=eq." +
            gameId
        },
        function(payload) {

          if (
            payload.new.status ===
            "playing"
          ) {

            setStatus(
              "✅ Partie en cours",
              "success"
            );

          }

        }
      )
      .subscribe(function(status) {

        console.log(
          "Realtime game :",
          status
        );

      });

}


function startPolling() {

  stopPolling();

  pollTimer =
    setInterval(
      checkGame,
      3000
    );

}


function stopPolling() {

  if (pollTimer) {

    clearInterval(
      pollTimer
    );

    pollTimer = null;

  }

}


async function checkGame() {

  if (!gameId) {
    return;
  }

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("games")
        .select(
          "status, difficulty, player_count, undercover_count, topic"
        )
        .eq("id", gameId)
        .maybeSingle();

    if (error || !data) {
      return;
    }

    if (data.status === "playing") {

      setStatus(
        "✅ Partie en cours",
        "success"
      );

    }

  } catch (error) {

    console.error(
      "Vérification partie :",
      error
    );

  }

}


document
  .getElementById("backButton")
  .addEventListener(
    "click",
    function() {

      stopPolling();

      if (realtimeChannel) {

        supabaseClient.removeChannel(
          realtimeChannel
        );

      }

      let url =
        "index-multiplayer.html";

      if (gameId) {

        url +=
          "?game=" +
          encodeURIComponent(gameId);

        if (playerId) {

          url +=
            "&player=" +
            encodeURIComponent(playerId);

        }

      }

      window.location.href =
        url;

    }
  );


window.addEventListener(
  "beforeunload",
  function() {

    stopPolling();

    if (realtimeChannel) {

      supabaseClient.removeChannel(
        realtimeChannel
      );

    }

  }
);


loadGame();

</script>

</body>
</html>
